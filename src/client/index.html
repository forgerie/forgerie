<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Forgerie</title>
    <meta name="theme-color" content="#111214" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <style>
      :root {
        color-scheme: dark;
        /* Type ramp: four fluid steps. cqi resolves against the nearest
           inline-size container at the point of use, so text breathes with
           the surface that holds it, not the viewport. Controls stay at a
           static 16px (--pi-control-font-size): mobile browsers zoom any
           focused input below 16px, so control text must not shrink. */
        --pi-text-xs: clamp(0.6875rem, 0.67rem + 0.1cqi, 0.75rem);   /* 11 -> 12 */
        --pi-text-sm: clamp(0.75rem, 0.73rem + 0.1cqi, 0.8125rem);   /* 12 -> 13 */
        --pi-text-md: clamp(0.875rem, 0.86rem + 0.1cqi, 0.9375rem);  /* 14 -> 15 */
        --pi-text-lg: clamp(1.0625rem, 1.04rem + 0.15cqi, 1.125rem); /* 17 -> 18 */
        /* Space ramp: named fluid steps for gaps and padding. */
        --pi-space-xs: 0.25rem;
        --pi-space-sm: clamp(0.375rem, 0.35rem + 0.15cqi, 0.5rem);   /* 6 -> 8 */
        --pi-space-md: clamp(0.625rem, 0.58rem + 0.25cqi, 0.75rem);  /* 10 -> 12 */
        --pi-space-lg: clamp(0.875rem, 0.8rem + 0.4cqi, 1.125rem);   /* 14 -> 18 */
        /* Radius scale: deliberately static. A corner that scales with the
           container reads as a rendering bug, not as fluid design. Three
           tiers plus the pill: inline chrome (code, kbd), controls, and
           surfaces (cards, dialogs, islands, popovers). */
        --pi-radius-inline: 4px;
        --pi-radius-control: 8px;
        --pi-radius-surface: 12px;
        --pi-radius-pill: 999px;
        /* Motion scale: two speeds. Fast is micro feedback (hover, fades);
           move is structural travel (panels, drawers, toasts). Ambient status
           pulses keep their own slow rhythms and are not on this scale. */
        --pi-motion-fast: 120ms;
        --pi-motion-move: 180ms;
        /* Focus ring: one ring for the whole app, always the accent. */
        --pi-focus-ring: 2px solid var(--pi-accent);
        --pi-control-font-size: 16px;
        --pi-control-font-family: system-ui, sans-serif;
        --pi-control-monospace-font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        /* Fallback palette: mirrors the Forgerie Dark theme contribution in
           plugins/themes/index.ts so the pre-theme flash matches the default
           theme. Keep the two in sync when the palette changes. */
        --pi-bg: #111214;
        --pi-surface: #191a1d;
        --pi-surface-hover: #202225;
        --pi-terminal-bg: #0c0d0f;
        --pi-terminal-text: #e6e7e9;
        --pi-border: #2a2c30;
        --pi-border-muted: #202225;
        --pi-text: #e6e7e9;
        --pi-text-secondary: #a9abb0;
        --pi-text-bright: #ffffff;
        --pi-muted: #85888e;
        --pi-dim: #62656b;
        --pi-accent: #6699e0;
        --pi-accent-border: #4a7cc4;
        --pi-selection-bg: #1d2331;
        --pi-success: #56b380;
        --pi-success-border: #2e7d54;
        --pi-success-bg: #14201a;
        --pi-success-surface: #182a20;
        --pi-success-ring: #56b38055;
        --pi-warning: #d0a04a;
        --pi-warning-border: #8a6420;
        --pi-warning-surface: #221c11;
        --pi-danger: #e06c75;
        --pi-purple: #a89ede;
        --pi-purple-border: #7f74b8;
        --pi-purple-surface: #1e1b2b;
        --pi-overlay: #0009;
        --pi-shadow-soft: #00000059;
        --pi-shadow: #00000073;
        --pi-shadow-strong: #00000090;
        --pi-bg-overlay-soft: #111214dd;
        --pi-bg-overlay: #111214e6;
        --pi-success-bg-overlay: #14201aee;
        --pi-terminal-selection: #2b3d5c;

        /* Calm transcript vocabulary.
           Derived from the palette above rather than contributed per theme, so
           every theme -- including plugin-contributed ones -- resolves these
           without declaring them. Custom properties substitute at the point of
           use, so these follow runtime theme switches automatically. */
        --calm-canvas: var(--pi-bg);
        --calm-canvas-soft: var(--pi-surface);
        --calm-ink: var(--pi-text);
        /* Deliberately --pi-muted, not --pi-text-secondary. The shipped light
           theme sets --pi-text-secondary identical to --pi-text, which would
           collapse the tonal difference the transcript uses to tell a user
           message from a reply. --pi-muted keeps separation in every theme. */
        --calm-ink-muted: var(--pi-muted);
        --calm-ink-dim: var(--pi-dim);
        --calm-rule: color-mix(in srgb, var(--pi-border) 70%, transparent);
        --calm-danger: var(--pi-danger);
        --calm-accent: var(--pi-accent);

        /* Reading measure for the transcript column. Uses cqi, so it only
           resolves inside an inline-size container -- see the transcript
           scroller.

           Deliberately not expressed in ch. Transcript children run at
           different font sizes (messages 14px, history boundary 12px), and ch
           resolves against the element it is used on, so a ch-based cap gives
           each child a different width and the column comes out ragged.
           36rem is about 71 characters at the transcript's 15px prose, which
           stays inside the range where the eye reliably finds the next line.
           Raising the cap without raising the type would have pushed past it,
           which is the usual way a reading column is spoiled.

           Stated as the cap or what is left of the container after the gutters,
           whichever is smaller -- not as a percentage that approximates the
           same thing. Every surface that lays itself out on this column has to
           arrive at one number: when the composer used the cap while the
           transcript track used what actually fit, the two disagreed by 26px on
           a folded phone and the alignment came apart exactly where the screen
           is tightest. */
        --calm-measure: min(36rem, 100cqi - 2 * var(--calm-gutter));
        /* The gutter either side of the content column. It is wide enough to
           hold the composer's chrome -- island border and padding, draft border
           and padding -- outside the column, because the composer aligns the
           first character of the draft to the column and lets the box it is
           drawn in hang into the gutter. A gutter narrower than that chrome
           would make the alignment impossible to satisfy. */
        --calm-gutter: 32px;
        /* Bleed is space, not width.

           A table or a code block is not prose: it keeps the column's start
           edge and may run past its end into the free space beside the column,
           and never further. Derived from what is actually free rather than
           chosen, and capped so a wide monitor does not stretch a table to the
           horizon.

           What it is not is part of the column. The column is what the eye
           reads and what the hand writes into; making it as wide as the widest
           table would leave that much empty space on every screen that has no
           table on it. A feature takes what it needs (fit-content) up to this
           bound, so the space appears only when something wide is on screen. */
        --calm-bleed: min(max(0px, (100cqi - 2 * var(--calm-gutter) - var(--calm-measure)) / 2), 10rem);
        /* Wide on purpose. This is the only break in the transcript that has to
           be seen without being read, and it has to hold apart two things that
           look alike: the step count closing one turn and the question opening
           the next. */
        --calm-turn-gap: 3.5rem;
        /* Space between paragraphs of one turn. The turn gap is reserved for
           the boundary between turns, so the two are told apart at a glance. */
        --calm-para-gap: 1rem;
      }
      /*
       * The shell reads horizontal drags to pull its side panels in. Without
       * this, any drag the shell does not claim falls through to the browser's
       * own back-and-forward swipe and navigates the app away mid-gesture.
       * Vertical overscroll is left alone: pull-to-refresh is not in the way.
       */
      html { overscroll-behavior-x: none; }
      /* Thin, palette-tinted scrollbars in every scroll container. These two
         properties inherit through shadow roots, unlike ::-webkit-scrollbar
         rules, so one declaration themes both modes everywhere. */
      html { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--pi-muted) 40%, transparent) transparent; }
      /* Tabular figures everywhere a number lives: times, counts, and meters
         align into columns instead of jittering. font-variant-numeric inherits
         through shadow roots, so one declaration covers every component. */
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--pi-bg); color: var(--pi-text); font-variant-numeric: tabular-nums; }
      body { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <pi-web-app></pi-web-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
