name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report Linux and Windows results independently instead of cancelling
      # the matrix on the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      # The root prepare script also installs the browser's locked dependencies.
      - name: Install server and browser dependencies
        run: npm ci

      - name: Verify static checks
        if: runner.os == 'Linux'
        run: npm run verify:static

      - name: Run tests
        if: runner.os == 'Windows'
        run: npm test

      - name: Run tests and measure coverage
        if: runner.os == 'Linux'
        run: npm run test:coverage

      - name: Verify the browser app
        if: runner.os == 'Linux'
        run: npm run verify:ui

      - name: Upload test coverage report
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Smoke test npm 12 global package install
        if: runner.os == 'Linux'
        run: npm run smoke:package-install

      - name: Check npm package contents
        run: npm run pack:dry
