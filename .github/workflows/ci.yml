name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Keep the existing Linux check name for branch protection.
    name: Verify and package (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      # Full history: durableSessionJournal.test.ts reads an earlier build with `git show <sha>:<path>`.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      # The root prepare script also installs the browser's locked dependencies.
      - name: Install server and browser dependencies
        run: npm ci

      - name: Verify static checks
        run: npm run verify:static

      # Compiler-graph and SDK acceptance tests contend for CPU under coverage.
      # Serialize files rather than increasing deadlines or dropping coverage.
      - name: Run tests and measure coverage
        run: npm run test:coverage -- --no-file-parallelism

      - name: Verify the browser app
        run: npm run verify:ui

      - name: Upload test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Smoke test npm 12 global package install
        run: npm run smoke:package-install

      - name: Check npm package contents
        run: npm run pack:dry
