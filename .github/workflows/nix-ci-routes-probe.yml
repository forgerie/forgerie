name: Disposable Nix CI route comparison

on:
  push:
    branches: [proto/nix-ci-routes-hosted]

permissions:
  contents: read

concurrency:
  group: nix-ci-routes-probe
  cancel-in-progress: false

jobs:
  compare:
    name: Nix route (${{ matrix.route }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        route: [yeradon, arion]
    steps:
      - name: Checkout the disposable harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install Nix on the disposable hosted VM
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build and test the route
        run: python3 prototypes/nix-ci-routes/run-hosted.py ${{ matrix.route }}
      - name: Preserve test receipts and coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nix-ci-${{ matrix.route }}
          path: |
            /tmp/nix-ci-routes/hosted.json
            /tmp/nix-ci-routes/*/receipt.json
            /tmp/nix-ci-routes/*/coverage/
          if-no-files-found: warn
          retention-days: 7
