const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
function highlight(line, inFront) {
  if (line === "---") return `<span class="fm">---</span>`;
  if (inFront) {
    const m = /^(\s*)([a-z-]+)(:)(.*)$/.exec(line);
    if (m) return `${m[1]}<span class="k">${m[2]}</span>${m[3]}<span class="s">${esc(m[4])}</span>`;
    return `<span class="s">${esc(line)}</span>`;
  }
  if (/^#{1,6} /.test(line)) return `<span class="h">${esc(line)}</span>`;
  let out = esc(line)
    .replace(/^(\s*)(-|\d+\.)( )/, '$1<span class="b">$2</span>$3')
    .replace(/\*\*([^*]+)\*\*/g, '<span class="st">**$1**</span>')
    .replace(/`([^`]+)`/g, '<span class="ic">`$1`</span>');
  return out;
}
function editorLines(lines, { edited = [], caret } = {}) {
  let front = false, seen = 0;
  return lines.map((line, i) => {
    if (line === "---") { seen++; front = seen === 1; }
    const html = highlight(line, front && line !== "---");
    const n = i + 1;
    const caretHtml = caret && caret.line === n ? '<span class="caret"></span>' : "";
    return `<div class="ln"${edited.includes(n) ? " data-edited" : ""}${caret && caret.line === n ? " data-caret" : ""}><span class="mark"></span><span class="no">${n}</span><span class="tx">${html}${caretHtml}</span></div>`;
  }).join("");
}

    if (state === "hidden") tag = '<span class="tag">hidden by Forgerie</span>';
    if (state === "wins") tag = '<span class="tag">hides yours</span>';
    if (fromPackage) tag = `<span class="tag">${state}</span>`;
    return `<li class="row"${isCurrent ? ' aria-current="true"' : ""}${state === "hidden" ? " data-hidden" : ""}><span class="nm">${nm}</span>${tag}<span class="ds">${ds}</span></li>`;
  }).join("");
}
function origin(name, n, where, items, opts = {}) {
  return `<section class="origin"><div class="origin-head">${opts.locked ? `<span class="lock">${I.lock}</span>` : ""}<span class="name">${name}</span><span class="n">${n}</span><span class="where">${where}</span></div>
    <ul class="rows">${rows(items, opts)}</ul>${opts.more ? `<div class="more">${opts.more}</div>` : ""}</section>`;
}

function sessionView() {
  return `
  <header class="header">
    <button class="icon-btn files-opener" aria-label="Show files">${I.files}</button>
    <div class="grow"><span class="title">Skills and prompts</span><span class="subtitle">on pi-extension-loading-points</span></div>
    <button class="icon-btn" aria-label="Read the files again">${I.refresh}</button>
    <button class="icon-btn" aria-label="Close">${I.x}</button>
  </header>
  <div class="body">
    <aside class="list-pane">
      <div class="list-top">
        <div class="kinds" role="group" aria-label="Kind">
          <button aria-pressed="true">Skills <span class="n">52</span></button>
          <button aria-pressed="false">Prompts <span class="n">8</span></button>
          <button aria-pressed="false">Context <span class="n">3</span></button>
        </div>
        <div class="filter">${I.search}Filter skills</div>
      </div>
      <div class="list">
        ${origin("This project", 5, ".agents/skills", PROJECT, { current: "testing-guide", cur: true })}
        ${origin("Yours", 38, "~/.agents/skills", YOURS, { more: "Show 26 more" })}
        ${origin("Built into Forgerie", 6, "read-only", FORGERIE, { locked: true })}
        ${origin("From packages", 3, "read-only", PACKAGES, { locked: true })}
      </div>
    </aside>
    <main class="doc-pane">
      <div class="doc-head">
        <div class="doc-title"><h1>testing-guide</h1><span class="chip project">This project</span></div>
        <div class="where-line"><code>.agents/skills/testing-guide/SKILL.md</code><span class="sep"></span><span style="display:inline-flex;gap:.3rem;align-items:center">${I.branch}pi-extension-loading-points worktree</span></div>
      </div>
      <div class="editor">${editorLines(TESTING, { edited: [8], caret: { line: 8 } })}</div>
      <div class="savebar">
        <p><strong>1 line changed.</strong> Saving leaves an uncommitted change in this worktree. This session reads it after <code>/reload</code>.</p>
        <div class="actions"><button class="btn quiet">Discard</button><button class="btn primary">Save</button></div>
      </div>
    </main>
  </div>`;
}

function settingsView() {
  return `
  <header class="header">
    <button class="icon-btn files-opener" aria-label="Show files">${I.files}</button>
    <span class="panel-icon">${I.panel}</span>
    <div class="grow"><button class="back">${I.back}Settings</button><span class="title">Skills and prompts</span></div>
    <button class="icon-btn" aria-label="Close">${I.x}</button>
  </header>
  <div class="body">
    <aside class="list-pane">
      <div class="list-top">
        <div class="kinds" role="group" aria-label="Kind">
          <button aria-pressed="true">Skills <span class="n">47</span></button>
          <button aria-pressed="false">Prompts <span class="n">6</span></button>
          <button aria-pressed="false">Context <span class="n">2</span></button>
        </div>
        <div class="filter">${I.search}Filter skills</div>
        <p class="bridge">A project's own skills and prompts are in each session: <b>Session menu → Skills and prompts</b>.</p>
      </div>
      <div class="list">
        ${origin("Yours", 38, "~/.agents/skills", YOURS.slice(0, 7), { more: "Show 31 more" })}
        ${origin("Built into Forgerie", 6, "read-only", FORGERIE.slice(0, 3), { locked: true, more: "Show 3 more" })}
        ${origin("From packages", 3, "read-only", PACKAGES, { locked: true, current: "mobbin-reference", cur: true })}
      </div>
    </aside>
    <main class="doc-pane">
      <div class="doc-head">
        <div class="doc-title"><h1>mobbin-reference</h1><span class="chip">${I.lock}Read-only</span></div>
        <div class="where-line"><span>From the <b style="font-weight:500;color:var(--quiet-foreground)">pi-mobbin</b> package</span><span class="sep"></span><code>skills/mobbin-reference/SKILL.md</code></div>
      </div>
      <div class="editor readonly">${editorLines(MOBBIN)}</div>
      <div class="savebar lockbar">
        <p>${I.lock}<span>A package update replaces this file, so Forgerie shows it read-only. To change it, edit the package, or turn the package off and copy the skill into yours.</span></p>
        <div class="actions"><button class="btn quiet">Open in Plugins</button></div>
      </div>
    </main>
  </div>`;
}

const view = new URLSearchParams(location.search).get("view") ?? "session";
document.getElementById("app").innerHTML = view === "settings" ? settingsView() : sessionView();
// The open file's row stays in view, as the real list would keep it.
document.querySelector(".row[aria-current]")?.scrollIntoView({ block: "center" });
</script>
</body>
</html>
