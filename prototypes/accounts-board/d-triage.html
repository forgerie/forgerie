<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LLM accounts — D · triage</title>
<link rel="stylesheet" href="board.css" />
<style>
  /* Iteration D — triage. One number per account: the binding constraint
     (least remaining window). Accounts needing attention sort first. The
     3-meters-away extreme: four numerals and four words tell the story;
     everything else is a whisper under them. */

  .triage {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    min-height: 0;
  }

  .t-row {
    display: grid;
    grid-template-columns: minmax(min(38cqi, 14rem), auto) 1fr;
    align-items: center;
    column-gap: var(--board-gutter);
    padding: clamp(0.6rem, 1.6cqb, 1.6rem) clamp(0.6rem, 1.4cqi, 1.6rem);
    border-top: 1px solid var(--pi-border-muted);
  }
  .t-row:first-child { border-top: 0; }
  .t-row.in-use { background: var(--pi-selection-bg); box-shadow: inset 2px 0 0 var(--pi-accent); }

  .t-num {
    font-size: var(--board-num);
    font-weight: 650;
    line-height: 0.95;
    color: var(--pi-text-bright);
    justify-self: end;
  }
  .t-num .pct { font-size: 0.45em; font-weight: 600; color: var(--pi-text-secondary); }
  .t-num.word-only { font-size: calc(var(--board-num) * 0.52); line-height: 1.05; }

  .t-detail { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .t-name { display: flex; align-items: baseline; gap: var(--pi-space-md); }
  .t-name .name { font-size: var(--board-label); font-weight: 650; color: var(--pi-text-bright); }
  .t-name .key {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: var(--pi-text-xs);
    color: var(--pi-dim);
  }
  .t-bind { font-size: var(--board-meta); color: var(--pi-text-secondary); }
  .t-rest { font-size: var(--board-meta); color: var(--pi-muted); }
  .t-meta { font-size: var(--pi-text-xs); color: var(--pi-dim); display: flex; gap: 10px; align-items: baseline; }
</style>
</head>
<body>
<div class="board">
  <header class="board-chrome">
    <span class="board-title">LLM accounts · least headroom first</span>
    <span class="board-clock" id="clock"></span>
  </header>
  <main class="board-body">
    <div class="triage" id="triage"></div>
  </main>
  <footer class="board-footnote">iteration D — triage</footer>
</div>
<script src="data.js"></script>
<script>
  const B = window.BOARD;

  const urgency = (a) => {
    if (a.expired) return -2; // unusable — attention first
    if (a.error) return -1;   // refusing requests
    const bind = B.headroom(a);
    return bind ? B.remainingPercent(bind) : 100;
  };

  const row = (a, now) => {
    const state = B.accountState(a);
    const bind = B.headroom(a);
    const tone = a.expired ? "danger" : bind ? B.windowTone(bind) : null;
    const numeral = a.expired
      ? `<span class="t-num word-only tone-danger">signed<br/>out</span>`
      : `<span class="t-num ${tone ? `tone-${tone}` : ""}">${B.remainingPercent(bind)}<span class="pct">% left</span></span>`;
    const bindLine = a.expired
      ? `<span class="t-bind">sign in again with <code class="auth-hint">/login ${a.key}</code></span>`
      : `<span class="t-bind">${bind.label} is the limit · ${B.resetLine(bind, now)}</span>`;
    const rest = a.expired ? "" : a.windows
      .filter((w) => w !== bind)
      .map((w) => `<span class="t-rest">${w.label} · ${B.remainingPercent(w)}% left · ${B.resetLine(w, now)}</span>`)
      .join("");
    const meta = [
      a.inUse ? `<span class="state-word tone-accent"><span class="in-use-dot"></span> in use</span>` : "",
      state ? `<span class="state-word tone-${state.tone}">${state.word}</span>` : "",
      `<span class="checked ${B.isStale(a, now) ? "stale" : ""}">${B.checkedLine(a, now)}</span>`,
    ].filter(Boolean).join("");
    return `
      <div class="t-row ${a.inUse ? "in-use" : ""}">
        ${numeral}
        <div class="t-detail">
          <span class="t-name"><span class="name">${a.product} ${a.ordinal}</span><span class="key">${a.key}</span></span>
          ${bindLine}
          ${rest}
          <span class="t-meta">${meta}</span>
        </div>
      </div>`;
  };

  B.startBoardClock((now) => {
    document.getElementById("clock").textContent = B.fmtClock(now, now);
    const sorted = [...B.ACCOUNTS].sort((x, y) => urgency(x) - urgency(y));
    document.getElementById("triage").innerHTML = sorted.map((a) => row(a, now)).join("");
  });
</script>
</body>
</html>
