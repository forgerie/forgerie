<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LLM accounts — A · meter wall</title>
<link rel="stylesheet" href="board.css" />
<style>
  /* Iteration A — meter wall. Each account is an instrument-cluster card:
     two labeled fuel gauges (5 h, 7 d), remaining % as the bright numeral,
     reset time in both absolute and relative form. Grid gains columns from
     space (auto-fit), never from a breakpoint. */

  .wall {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr));
    gap: var(--board-gutter);
    /* content-height rows, vertically centered: instruments, not columns */
    align-content: center;
  }

  .card {
    display: flex;
    flex-direction: column;
    gap: var(--pi-space-lg);
    background: var(--pi-surface);
    border-radius: var(--pi-radius-surface);
    padding: clamp(1rem, 2.4cqi, 2rem);
    min-height: 0;
  }
  .card.in-use {
    background: var(--pi-selection-bg);
    box-shadow: inset 2px 0 0 var(--pi-accent);
  }
  .card.expired { color: var(--pi-dim); }

  .card-head { display: flex; align-items: baseline; gap: var(--pi-space-md); }
  .card-name {
    font-size: var(--board-label);
    font-weight: 650;
    color: var(--pi-text-bright);
  }
  .card.expired .card-name { color: var(--pi-muted); }
  .card-key {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: var(--pi-text-xs);
    color: var(--pi-dim);
  }
  .card-state { margin-left: auto; display: flex; align-items: center; gap: 6px; }

  .gauge { display: flex; flex-direction: column; gap: var(--pi-space-sm); }
  .gauge-row { display: flex; align-items: baseline; gap: var(--pi-space-md); }
  .gauge-value {
    font-size: var(--board-num-md);
    font-weight: 650;
    line-height: 1;
    color: var(--pi-text-bright);
  }
  .gauge-value .pct { font-size: 0.55em; font-weight: 600; color: var(--pi-text-secondary); }
  .gauge-value .word { font-size: 0.42em; font-weight: 500; color: var(--pi-muted); margin-left: 0.35em; }
  .gauge-label { margin-left: auto; font-size: var(--board-meta); color: var(--pi-muted); }

  .gauge-track {
    height: clamp(10px, 1.1cqi, 16px);
    border-radius: var(--pi-radius-pill);
    background: var(--pi-surface-hover);
    overflow: hidden;
  }
  .card.in-use .gauge-track { background: color-mix(in srgb, var(--pi-surface-hover) 70%, var(--pi-selection-bg)); }
  .gauge-fill {
    height: 100%;
    border-radius: inherit;
    background: var(--pi-text-secondary);
    transition: width var(--pi-motion-move) ease;
  }
  .gauge-fill.tone-warning { background: var(--pi-warning); }
  .gauge-fill.tone-danger { background: var(--pi-danger); }
  @media (prefers-reduced-motion: reduce) { .gauge-fill { transition: none; } }

  .gauge-reset { font-size: var(--board-meta); color: var(--pi-muted); }

  .card-foot { margin-top: auto; display: flex; align-items: baseline; gap: var(--pi-space-md); }
  .expired-body {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    font-size: var(--board-meta);
    color: var(--pi-muted);
  }
</style>
</head>
<body>
<div class="board">
  <header class="board-chrome">
    <span class="board-title">LLM accounts</span>
    <span class="board-clock" id="clock"></span>
  </header>
  <main class="board-body">
    <div class="wall" id="wall"></div>
  </main>
  <footer class="board-footnote">iteration A — meter wall</footer>
</div>
<script src="data.js"></script>
<script>
  const B = window.BOARD;

  const gauge = (w, now) => {
    const left = B.remainingPercent(w);
    const tone = B.windowTone(w);
    return `
      <section class="gauge">
        <div class="gauge-row">
          <span class="gauge-value ${tone ? `tone-${tone}` : ""}">${left}<span class="pct">%</span><span class="word">left</span></span>
          <span class="gauge-label">${w.label}</span>
        </div>
        <div class="gauge-track"><div class="gauge-fill ${tone ? `tone-${tone}` : ""}" style="width:${left}%"></div></div>
        <div class="gauge-reset">${B.resetLine(w, now)}</div>
      </section>`;
  };

  const card = (a, now) => {
    const state = B.accountState(a);
    const classes = ["card", a.inUse ? "in-use" : "", a.expired ? "expired" : ""].join(" ");
    const stateHtml = a.inUse
      ? `<span class="card-state"><span class="in-use-dot"></span><span class="state-word tone-accent">in use</span></span>`
      : state
        ? `<span class="card-state"><span class="state-word tone-${state.tone}">${state.word}</span></span>`
        : "";
    const body = a.expired
      ? `<div class="expired-body"><span>sign in again with&nbsp;<code class="auth-hint">/login ${a.key}</code></span></div>`
      : a.windows.map((w) => gauge(w, now)).join("");
    return `
      <article class="${classes}">
        <header class="card-head">
          <span class="card-name">${a.product} ${a.ordinal}</span>
          <span class="card-key">${a.key}</span>
          ${stateHtml}
        </header>
        ${body}
        <footer class="card-foot">
          <span class="checked ${B.isStale(a, now) ? "stale" : ""}">${B.checkedLine(a, now)}</span>
        </footer>
      </article>`;
  };

  B.startBoardClock((now) => {
    document.getElementById("clock").textContent = B.fmtClock(now, now);
    document.getElementById("wall").innerHTML = B.ACCOUNTS.map((a) => card(a, now)).join("");
  });
</script>
</body>
</html>
