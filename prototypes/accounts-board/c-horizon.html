<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LLM accounts — C · horizon</title>
<link rel="stylesheet" href="board.css" />
<style>
  /* Iteration C — horizon. The axis is time: now → +24 h. Each account is a
     lane; each quota window is a chip placed at the moment its budget
     returns. Chips clustered at the left edge mean relief is near; a bare
     lane means nothing changes today. Resets beyond the horizon wait in the
     "later" rail. This one answers "when do I get budget back". */

  .horizon {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: minmax(9rem, 0.6fr) minmax(0, 3fr) minmax(9rem, 0.7fr);
    grid-template-rows: auto; /* axis row stays small … */
    grid-auto-rows: minmax(clamp(3.4rem, 16cqb, 7rem), 1fr); /* … lanes share the rest */
    align-content: stretch;
    column-gap: var(--board-gutter);
  }

  .axis-name, .axis-later {
    align-self: end;
    padding-bottom: var(--pi-space-sm);
    font-size: var(--board-meta);
    font-weight: 650;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--pi-dim);
  }
  .axis { position: relative; align-self: stretch; }
  .axis .tick {
    position: absolute;
    bottom: var(--pi-space-sm);
    transform: translateX(-50%);
    font-size: var(--board-meta);
    color: var(--pi-dim);
    white-space: nowrap;
  }
  .axis .tick.now { transform: none; color: var(--pi-text-secondary); }
  .axis .tick.end { transform: translateX(-100%); }

  .lane-name { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .lane-title { font-size: var(--board-label); font-weight: 650; color: var(--pi-text-bright); }
  .lane-title .in-use-dot { margin-right: 8px; }
  .lane-sub { font-size: var(--pi-text-xs); color: var(--pi-dim); }
  .lane-sub .state-word { font-size: inherit; }

  .lane-track {
    position: relative;
    border-top: 1px solid var(--pi-border-muted);
  }
  .lane-track::before {
    /* the now-line */
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 1px;
    background: var(--pi-border);
  }
  .lane-track .gridline {
    position: absolute;
    inset: 0 auto 0 0;
    width: 1px;
    background: color-mix(in srgb, var(--pi-border-muted) 55%, transparent);
  }

  .chip {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: baseline;
    gap: 8px;
    white-space: nowrap;
    background: var(--pi-surface);
    border-radius: var(--pi-radius-control);
    padding: clamp(6px, 0.8cqi, 12px) clamp(10px, 1.2cqi, 18px);
    font-size: var(--board-meta);
    color: var(--pi-text-secondary);
  }
  .chip strong { font-size: 1.15em; font-weight: 650; color: var(--pi-text-bright); }
  .chip .chip-left { font-weight: 650; color: var(--pi-text-bright); }
  .chip .delta { color: var(--pi-muted); }

  .lane-note {
    position: absolute;
    top: 50%;
    left: clamp(0.8rem, 2cqi, 2rem);
    transform: translateY(-50%);
    font-size: var(--board-meta);
    color: var(--pi-muted);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .later { display: flex; flex-direction: column; justify-content: center; gap: 6px; border-top: 1px solid var(--pi-border-muted); }
  .later-item { font-size: var(--board-meta); color: var(--pi-muted); }
  .later-item strong { color: var(--pi-text-secondary); font-weight: 650; }

  /* in-use marking stays on the name rail only: a tinted 24 h slab made the
     selection louder than the content it frames */
  .lane-name.in-use { box-shadow: inset 2px 0 0 var(--pi-accent); padding-left: var(--pi-space-md); }
</style>
</head>
<body>
<div class="board">
  <header class="board-chrome">
    <span class="board-title">LLM accounts · next 24 h</span>
    <span class="board-clock" id="clock"></span>
  </header>
  <main class="board-body">
    <div class="horizon" id="horizon"></div>
  </main>
  <footer class="board-footnote">iteration C — horizon</footer>
</div>
<script src="data.js"></script>
<script>
  const B = window.BOARD;
  const SPAN = 24 * B.HOUR;

  const pos = (atMs, now) => {
    const pct = ((atMs - now) / SPAN) * 100;
    return Math.min(96, Math.max(3, pct));
  };

  const chip = (w, now) => {
    const left = B.remainingPercent(w);
    const tone = B.windowTone(w);
    return `
      <span class="chip" style="left:${pos(w.resetsAtMs, now)}%">
        <strong>${w.id}</strong>
        <span class="chip-left ${tone ? `tone-${tone}` : ""}">${left}% left</span>
        <span class="delta">in ${B.fmtDelta(w.resetsAtMs - now)}</span>
      </span>`;
  };

  const lane = (a, now) => {
    const state = B.accountState(a);
    const nearby = a.windows.filter((w) => w.resetsAtMs - now <= SPAN);
    const far = a.windows.filter((w) => w.resetsAtMs - now > SPAN);
    const sub = [
      a.inUse ? `<span class="state-word tone-accent">in use</span>` : "",
      state ? `<span class="state-word tone-${state.tone}">${state.word}</span>` : "",
      `<span class="checked ${B.isStale(a, now) ? "stale" : ""}">${B.checkedLine(a, now)}</span>`,
    ].filter(Boolean).join(" · ");
    const trackBody = a.expired
      ? `<span class="lane-note">signed out — <code class="auth-hint">/login ${a.key}</code></span>`
      : nearby.map((w) => chip(w, now)).join("") ||
        `<span class="lane-note">no reset inside 24 h</span>`;
    const laterBody = far.length
      ? far.map((w) => `<span class="later-item"><strong>${w.id}</strong> · ${B.remainingPercent(w)}% left · ${B.fmtClock(w.resetsAtMs, now)}</span>`).join("")
      : `<span class="later-item">—</span>`;
    const gridlines = [6, 12, 18].map((h) => `<span class="gridline" style="left:${(h / 24) * 100}%"></span>`).join("");
    return `
      <div class="lane-name ${a.inUse ? "in-use" : ""}">
        <span class="lane-title">${a.inUse ? '<span class="in-use-dot"></span>' : ""}${a.product} ${a.ordinal}</span>
        <span class="lane-sub">${sub}</span>
      </div>
      <div class="lane-track">${gridlines}${trackBody}</div>
      <div class="later">${laterBody}</div>`;
  };

  const axis = (now) => {
    const ticks = [0, 6, 12, 18, 24].map((h) => {
      const left = (h / 24) * 100;
      const label = h === 0 ? "now" : B.fmtClock(now + h * B.HOUR, now);
      const cls = h === 0 ? "now" : h === 24 ? "end" : "";
      return `<span class="tick ${cls}" style="left:${left}%">${label}</span>`;
    }).join("");
    return `<div class="axis-name">account</div><div class="axis">${ticks}</div><div class="axis-later">later</div>`;
  };

  B.startBoardClock((now) => {
    document.getElementById("clock").textContent = B.fmtClock(now, now);
    document.getElementById("horizon").innerHTML =
      axis(now) + B.ACCOUNTS.map((a) => lane(a, now)).join("");
  });
</script>
</body>
</html>
