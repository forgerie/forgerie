<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LLM accounts — B · departure board</title>
<link rel="stylesheet" href="board.css" />
<style>
  /* Iteration B — departure board. No cards: one full-width row per account,
     hairline separations, numerals doing all the work. The quietest reading —
     closest to the app's list grammar, scaled up for distance. */

  .ledger {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .row {
    display: grid;
    grid-template-columns: minmax(11rem, 1.1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(9rem, 0.7fr);
    gap: var(--board-gutter);
    align-items: center;
    padding: clamp(0.8rem, 2.4cqb, 2rem) clamp(0.6rem, 1.2cqi, 1.4rem);
    border-top: 1px solid var(--pi-border-muted);
  }
  .row.head {
    border-top: 0;
    padding-top: 0;
    padding-bottom: var(--pi-space-sm);
  }
  .row.in-use { background: var(--pi-selection-bg); box-shadow: inset 2px 0 0 var(--pi-accent); }
  .ledger .row:not(.head) { flex: 1 1 auto; } /* rows share the frame height */
  .ledger .row:last-child { border-bottom: 1px solid var(--pi-border-muted); }

  .col-label {
    font-size: var(--board-meta);
    font-weight: 650;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--pi-dim);
  }

  .acct { display: flex; flex-direction: column; gap: 4px; }
  .acct-name { font-size: var(--board-label); font-weight: 650; color: var(--pi-text-bright); }
  .acct-name .in-use-dot { margin-right: 8px; }
  .acct-key {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: var(--pi-text-xs);
    color: var(--pi-dim);
  }

  .win { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .win-value { font-size: var(--board-num-md); font-weight: 650; line-height: 1; color: var(--pi-text-bright); }
  .win-value .pct { font-size: 0.55em; font-weight: 600; color: var(--pi-text-secondary); }
  .win-value .word { font-size: 0.42em; font-weight: 500; color: var(--pi-muted); margin-left: 0.35em; }
  .win-bar {
    height: 4px;
    border-radius: var(--pi-radius-pill);
    background: var(--pi-surface-hover);
    overflow: hidden;
    max-width: 16rem;
  }
  .win-bar > div { height: 100%; border-radius: inherit; background: var(--pi-text-secondary); }
  .win-bar > div.tone-warning { background: var(--pi-warning); }
  .win-bar > div.tone-danger { background: var(--pi-danger); }
  .win-reset { font-size: var(--board-meta); color: var(--pi-muted); }
  .win-empty { font-size: var(--board-num-md); color: var(--pi-dim); }

  .status { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .status .auth-hint { font-size: var(--pi-text-xs); }

  /* Narrow container: the ledger folds each account into a two-line block.
     Keyed to the space the ledger has, not the viewport. */
  @container (max-width: 46rem) {
    .row { grid-template-columns: 1fr 1fr; }
    .row.head { display: none; }
    .acct, .status { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div class="board">
  <header class="board-chrome">
    <span class="board-title">LLM accounts</span>
    <span class="board-clock" id="clock"></span>
  </header>
  <main class="board-body">
    <div class="ledger" id="ledger"></div>
  </main>
  <footer class="board-footnote">iteration B — departure board</footer>
</div>
<script src="data.js"></script>
<script>
  const B = window.BOARD;

  const win = (a, id, now) => {
    const w = a.windows.find((x) => x.id === id);
    if (!w) return `<div class="win"><span class="win-empty">—</span></div>`;
    const left = B.remainingPercent(w);
    const tone = B.windowTone(w);
    return `
      <div class="win">
        <span class="win-value ${tone ? `tone-${tone}` : ""}">${left}<span class="pct">%</span><span class="word">left</span></span>
        <div class="win-bar"><div class="${tone ? `tone-${tone}` : ""}" style="width:${left}%"></div></div>
        <span class="win-reset">${B.resetLine(w, now)}</span>
      </div>`;
  };

  const status = (a, now) => {
    const state = B.accountState(a);
    const pieces = [];
    if (a.inUse) pieces.push(`<span class="state-word tone-accent">in use</span>`);
    if (state) pieces.push(`<span class="state-word tone-${state.tone}">${state.word}</span>`);
    if (a.expired) pieces.push(`<code class="auth-hint">/login ${a.key}</code>`);
    pieces.push(`<span class="checked ${B.isStale(a, now) ? "stale" : ""}">${B.checkedLine(a, now)}</span>`);
    return `<div class="status">${pieces.join("")}</div>`;
  };

  const row = (a, now) => `
    <div class="row ${a.inUse ? "in-use" : ""}">
      <div class="acct">
        <span class="acct-name">${a.inUse ? '<span class="in-use-dot"></span>' : ""}${a.product} ${a.ordinal}</span>
        <span class="acct-key">${a.key}</span>
      </div>
      ${win(a, "5h", now)}
      ${win(a, "7d", now)}
      ${status(a, now)}
    </div>`;

  B.startBoardClock((now) => {
    document.getElementById("clock").textContent = B.fmtClock(now, now);
    document.getElementById("ledger").innerHTML = `
      <div class="row head">
        <span class="col-label">account</span>
        <span class="col-label">5 h window</span>
        <span class="col-label">7 d window</span>
        <span class="col-label">state</span>
      </div>
      ${B.ACCOUNTS.map((a) => row(a, now)).join("")}`;
  });
</script>
</body>
</html>
