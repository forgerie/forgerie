<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LLM accounts — F · trails</title>
<link rel="stylesheet" href="board.css" />
<style>
  /* Iteration F — trails. A seismograph: each account draws its remaining
     budget over the last 8 h; right of the now-line the trail continues as a
     dashed projection at the current burn rate and jumps at the refill.
     Slope = how fast you are burning. Cliff = relief. A dead-flat red floor
     = rate limited. A hatched lane = signed out. The data draws itself;
     words are engravings on the rail. */

  .trails { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

  .axis {
    position: relative;
    height: 1.5rem;
    margin-left: var(--rail-w);
    font-size: var(--pi-text-xs);
    color: var(--pi-dim);
  }
  .axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .axis .now { color: var(--pi-accent); }

  .lanes { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

  .now-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: color-mix(in srgb, var(--pi-accent) 55%, transparent);
    z-index: 2;
  }

  .lane {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: var(--rail-w) 1fr;
    border-top: 1px solid var(--pi-border-muted);
  }
  .lane:last-child { border-bottom: 1px solid var(--pi-border-muted); }

  .rail { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding-right: var(--pi-space-lg); }
  .rail.in-use { box-shadow: inset 2px 0 0 var(--pi-accent); padding-left: var(--pi-space-md); }
  .rail .name { font-size: var(--board-label); font-weight: 650; color: var(--pi-text-bright); }
  .rail .name .in-use-dot { margin-right: 8px; }
  .rail .word { font-size: var(--pi-text-xs); font-weight: 600; }

  .strip { position: relative; min-width: 0; }
  .strip svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .strip .reset-label {
    position: absolute;
    top: 4px;
    transform: translateX(-50%);
    font-size: var(--pi-text-xs);
    color: var(--pi-muted);
    white-space: nowrap;
  }
  .strip.dead {
    background: repeating-linear-gradient(45deg, transparent 0 9px, var(--pi-border-muted) 9px 10px);
  }
  .strip .dead-note {
    position: absolute;
    top: 50%;
    left: clamp(1rem, 4cqi, 4rem);
    transform: translateY(-50%);
    background: var(--pi-bg);
    padding: 4px 10px;
    font-size: var(--pi-text-xs);
    color: var(--pi-muted);
  }

  :root { --rail-w: clamp(8rem, 14cqi, 13rem); }
</style>
</head>
<body>
<div class="board">
  <header class="board-chrome">
    <span class="board-title">LLM accounts · last 8 h → next 6 h</span>
    <span class="board-clock" id="clock"></span>
  </header>
  <main class="board-body">
    <div class="trails">
      <div class="axis" id="axis"></div>
      <div class="lanes" id="lanes"></div>
    </div>
  </main>
  <footer class="board-footnote">iteration F — trails</footer>
</div>
<script src="data.js"></script>
<script>
  const B = window.BOARD;
  const PAST = 8 * B.HOUR;
  const FUTURE = 6 * B.HOUR;

  /* Anchor histories: [minutes-from-now, remaining %]. Deterministic and
     hand-shaped to match the fixture's present values; cliffs are refills. */
  const HISTORY = {
    "anthropic": {
      session: [[-480, 22], [-300, 14], [-183, 8], [-183, 100], [-150, 92], [-120, 70], [-90, 66], [-45, 48], [0, 38]],
      weekly: [[-480, 58], [-240, 56], [0, 54]],
    },
    "openai-codex": {
      session: [[-480, 55], [-300, 41], [-83, 30], [-83, 100], [-40, 94], [0, 87]],
      weekly: [[-480, 74], [0, 72]],
    },
    "openai-codex-2": {
      session: [[-480, 40], [-360, 24], [-278, 15], [-278, 100], [-240, 80], [-180, 45], [-120, 18], [-60, 4], [-50, 2], [0, 2]],
      weekly: [[-480, 14], [0, 12]],
      floorFromMin: -50, // rate-limited floor segment, drawn in danger
    },
  };

  const X = (tMs, now) => ((tMs - (now - PAST)) / (PAST + FUTURE)) * 1000;
  const Y = (r) => 8 + (100 - r) * 1.04;

  const interp = (anchors, m) => {
    for (let i = 1; i < anchors.length; i++) {
      const [m0, r0] = anchors[i - 1];
      const [m1, r1] = anchors[i];
      if (m <= m1) {
        if (m1 === m0) return r1;
        return r0 + ((r1 - r0) * (m - m0)) / (m1 - m0);
      }
    }
    return anchors[anchors.length - 1][1];
  };

  /* Staircase-quantized path through the anchors: quiet plotter texture. */
  const path = (anchors, now, fromMin, toMin) => {
    const pts = [];
    for (let m = fromMin; m <= toMin; m += 5) {
      const r = Math.round(interp(anchors, m) / 0.75) * 0.75;
      pts.push([X(now + m * B.MIN, now), Y(r)]);
    }
    // preserve vertical cliffs exactly — but only inside the drawn range
    anchors.forEach(([m, r], i) => {
      if (i > 0 && anchors[i - 1][0] === m && m >= fromMin && m <= toMin) {
        pts.push([X(now + m * B.MIN, now), Y(r)]);
      }
    });
    pts.sort((p, q) => p[0] - q[0]);
    return "M" + pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" L");
  };

  const projection = (a, h, now) => {
    const s5 = a.windows.find((w) => w.id === "5h");
    if (!s5) return "";
    const current = interp(h.session, 0);
    const last = interp(h.session, -60);
    const slopePerMin = (current - last) / 60;
    const resetMin = (s5.resetsAtMs - now) / B.MIN;
    const atReset = Math.max(0, current + slopePerMin * resetMin);
    const after = Math.max(92, 100 + slopePerMin * 60);
    const pts = [
      [0, current], [resetMin, atReset], [resetMin, 100],
      [Math.min(FUTURE / B.MIN, resetMin + 120), after],
    ].map(([m, r]) => `${X(now + m * B.MIN, now).toFixed(1)},${Y(r).toFixed(1)}`);
    return `M${pts.join(" L")}`;
  };

  const lane = (a, now) => {
    const state = B.accountState(a);
    const words = [
      a.inUse ? `<span class="word tone-accent">in use</span>` : "",
      state ? `<span class="word tone-${state.tone}">${state.word}</span>` : "",
      !a.expired && B.isStale(a, now) ? `<span class="word tone-warning">stale</span>` : "",
    ].filter(Boolean).join("");
    const rail = `
      <div class="rail ${a.inUse ? "in-use" : ""}">
        <span class="name">${a.inUse ? '<span class="in-use-dot"></span>' : ""}${a.product} ${a.ordinal}</span>
        ${words}
      </div>`;
    if (a.expired) {
      return `<div class="lane">${rail}
        <div class="strip dead"><span class="dead-note">no signal · <code class="auth-hint">/login ${a.key}</code></span></div>
      </div>`;
    }
    const h = HISTORY[a.key];
    const s5 = a.windows.find((w) => w.id === "5h");
    const rx = X(s5.resetsAtMs, now);
    const floor = h.floorFromMin !== undefined
      ? `<path d="${path(h.session, now, h.floorFromMin, 0)}" fill="none" stroke="var(--pi-danger)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`
      : "";
    return `
      <div class="lane">${rail}
        <div class="strip">
          <svg viewBox="0 0 1000 120" preserveAspectRatio="none">
            <line x1="${rx}" x2="${rx}" y1="0" y2="120" stroke="var(--pi-border)" vector-effect="non-scaling-stroke"/>
            <path d="${path(h.weekly, now, -PAST / B.MIN, 0)}" fill="none" stroke="var(--pi-border)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
            <path d="${path(h.session, now, -PAST / B.MIN, 0)}" fill="none" stroke="${a.inUse ? "var(--pi-accent)" : "var(--pi-text-secondary)"}" stroke-width="2" vector-effect="non-scaling-stroke"/>
            ${floor}
            <path d="${projection(a, h, now)}" fill="none" stroke="var(--pi-muted)" stroke-width="1.5" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>
          </svg>
          <span class="reset-label" style="left:${rx / 10}%">${B.fmtClock(s5.resetsAtMs, now)}</span>
        </div>
      </div>`;
  };

  B.startBoardClock((now) => {
    document.getElementById("clock").textContent = B.fmtClock(now, now);
    const ticks = [];
    const first = new Date(now - PAST);
    first.setMinutes(0, 0, 0);
    for (let t = first.getTime(); t <= now + FUTURE; t += 2 * B.HOUR) {
      if (t < now - PAST) continue;
      if (Math.abs(t - now) < 30 * B.MIN) continue; // keep clear of the now label
      if (X(t, now) > 960) continue; // keep clear of the right edge
      ticks.push(`<span style="left:${X(t, now) / 10}%">${B.fmtClock(t, now)}</span>`);
    }
    ticks.push(`<span class="now" style="left:${X(now, now) / 10}%">now</span>`);
    document.getElementById("axis").innerHTML = ticks.join("");
    const nowFrac = (PAST / (PAST + FUTURE)).toFixed(4);
    document.getElementById("lanes").innerHTML =
      `<div class="now-line" style="left: calc(var(--rail-w) + (100% - var(--rail-w)) * ${nowFrac})"></div>` +
      B.ACCOUNTS.map((a) => lane(a, now)).join("");
  });
</script>
</body>
</html>
