<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Craft test: register</title>
<style>
  /* ---------------------------------------------------------------
     CRAFT TEST - one screen, shell ignored.
     Testing hypothesis 1: the flatness came from removing containers
     without replacing them with craft.

     Boxless still holds. What changes here is precision:
     real contrast, real weight hierarchy, depth only where it earns
     its place, an engineered focus state, and one accent used with
     conviction instead of used once.

     Accent: ember. A forge is hot metal on a cold anvil. Every dev
     tool is indigo or green; this is neither, and it is legible at
     small sizes on a cool near-black.
     --------------------------------------------------------------- */

  :root {
    color-scheme: dark;

    /* cool near-black, blue undertone, never pure #000 */
    --bg:        #0a0b0f;
    --bg-lift:   #0e1016;   /* used only in gradients, never as a fill */
    --rule:      #191c24;
    --rule-soft: #14161d;

    /* real contrast. primary text is close to white, not grey. */
    --ink:       #f2f4f8;
    --ink-2:     #aab2c0;
    --ink-3:     #6b7484;
    --ink-4:     #4a525f;

    /* ember, committed to */
    --ember:     #ff7a45;
    --ember-lit: #ff9a6e;
    --ember-dim: #ff7a4526;

    --run:       #3ddc97;
    --wait:      #ffc65c;
    --block:     #ff5f6d;

    --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;

    --gutter: clamp(16px, 4cqi, 32px);
    --row-y: 8px;
  }
  [data-density="compact"] { --row-y: 5px; }

  * { box-sizing: border-box; min-width: 0; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 15px/1.6 var(--ui);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .register {
    container-type: inline-size;
    height: 100dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding-bottom: 56px;
    /* a single light source at the top. depth without a box. */
    background:
      radial-gradient(120% 40% at 50% -6%, #141824 0%, transparent 62%),
      var(--bg);
  }

  /* ---- group headings: confident, not apologetic ---------------- */
  .group {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: clamp(20px, 3cqi, 30px) var(--gutter) 7px;
  }
  .group:first-child { padding-top: clamp(16px, 2.5cqi, 24px); }
  .group .label {
    font: 600 11px/1 var(--ui);
    letter-spacing: 0.085em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .group .n {
    font: 500 11px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink-4);
  }
  .group .hair {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--rule), transparent 78%);
  }

  /* ---- the row --------------------------------------------------- */
  .row {
    position: relative;
    display: grid;
    grid-template-columns: 14px minmax(0, 1fr) auto;
    align-items: center;
    column-gap: 10px;
    row-gap: 1px;
    width: 100%;
    padding: var(--row-y) var(--gutter);
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    isolation: isolate;
  }

  /* hover and selection are drawn as light, not as a filled rectangle */
  .row::before {
    content: "";
    position: absolute;
    inset: 1px 8px 1px 8px;
    z-index: -1;
    border-radius: 7px;
    background: linear-gradient(180deg, #ffffff0a, #ffffff03);
    opacity: 0;
    transition: opacity .11s cubic-bezier(.2,0,0,1);
  }
  .row:hover::before { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .row::before { transition: none; } }

  .row[aria-current="true"]::before {
    opacity: 1;
    background:
      linear-gradient(90deg, var(--ember-dim), transparent 42%),
      linear-gradient(180deg, #ffffff10, #ffffff05);
    box-shadow: inset 0 1px 0 #ffffff12;
  }
  /* the ember bar: the one place the accent is unmissable */
  .row[aria-current="true"]::after {
    content: "";
    position: absolute;
    left: 0; top: 4px; bottom: 4px;
    width: 2px;
    border-radius: 0 2px 2px 0;
    background: var(--ember);
    box-shadow: 0 0 12px 0 #ff7a4566;
  }

  /* engineered focus: ring plus a faint bloom, never the browser default */
  .row:focus-visible { outline: none; }
  .row:focus-visible::before {
    opacity: 1;
    background: linear-gradient(180deg, #ffffff0d, #ffffff04);
    box-shadow:
      0 0 0 1px var(--ember),
      0 0 0 4px #ff7a4522;
  }

  /* status: shape carries meaning as well as colour */
  .mark {
    justify-self: center;
    width: 7px; height: 7px;
    border-radius: 999px;
    background: var(--ink-4);
    box-shadow: none;
  }
  .row[data-state="running"] .mark {
    background: var(--run);
    box-shadow: 0 0 0 3px #3ddc9718;
  }
  .row[data-state="waiting"] .mark {
    background: var(--wait);
    border-radius: 2px;                 /* square: needs a decision */
    width: 6px; height: 6px;
    box-shadow: 0 0 0 3px #ffc65c18;
  }
  .row[data-state="blocked"] .mark {
    background: transparent;
    border: 1.5px solid var(--block);   /* hollow: stopped */
    width: 7px; height: 7px;
  }

  .title {
    grid-column: 2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13.5px;
    font-weight: 480;
    letter-spacing: -0.012em;
    color: var(--ink-2);
  }
  .row:hover .title { color: var(--ink); }
  .row[data-unread="true"] .title { color: var(--ink); font-weight: 560; }
  .row[aria-current="true"] .title { color: #fff; font-weight: 580; }

  .age {
    grid-column: 3;
    font: 400 11px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    color: var(--ink-4);
  }
  .row[aria-current="true"] .age { color: var(--ink-3); }

  /* second line carries the live fact, not decoration */
  .under {
    grid-column: 2 / -1;
    display: flex;
    align-items: baseline;
    gap: 8px;
    overflow: hidden;
    font: 400 11px/1.5 var(--mono);
    letter-spacing: -0.005em;
    color: var(--ink-4);
  }
  .under .repo { color: var(--ink-3); }
  .under .sep { color: var(--ink-4); opacity: .55; }
  .under .doing {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--ink-3);
  }
  .under .churn { margin-left: auto; flex: none; font-variant-numeric: tabular-nums; }
  .under .churn .add { color: #3ddc97cc; }
  .under .churn .del { color: #ff5f6dcc; }
  [data-density="compact"] .under { display: none; }

  /* forks hang off a spine, so lineage is visible without a tree widget */
  .fork { padding-left: calc(var(--gutter) + 22px); }
  .fork::marker { content: ""; }
  .fork .spine {
    position: absolute;
    left: calc(var(--gutter) + 6px);
    top: 0; bottom: 50%;
    width: 1px;
    background: var(--rule);
  }
  .fork .spine::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 9px; height: 1px;
    background: var(--rule);
  }

  /* the ask is the one row allowed to raise its voice */
  .row[data-state="waiting"][data-unread="true"] .title::after {
    content: "";
    display: inline-block;
    width: 5px; height: 5px;
    margin-left: 7px;
    border-radius: 999px;
    background: var(--wait);
    vertical-align: 1px;
  }

  /* ---- overflow affordance, not a truncated list ---------------- */
  .more {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin: 6px 0 0 var(--gutter);
    padding: 5px 0;
    border: 0;
    background: transparent;
    color: var(--ink-3);
    font: 400 12px/1 var(--ui);
    cursor: pointer;
    border-bottom: 1px solid transparent;
  }
  .more:hover { color: var(--ember-lit); }
  .more:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
  .more .chev { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- footer rail: density and shortcuts, weightless ----------- */
  .rail {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 9px var(--gutter) calc(9px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent, var(--bg) 42%);
    font: 400 11px/1 var(--mono);
    color: var(--ink-4);
  }
  .rail .spacer { flex: 1; }
  kbd {
    display: inline-block;
    min-width: 15px;
    padding: 2px 4px;
    border-radius: 4px;
    background: #ffffff0d;
    box-shadow: inset 0 -1px 0 #00000059, inset 0 1px 0 #ffffff0f;
    color: var(--ink-3);
    font: 500 10.5px/1 var(--mono);
    text-align: center;
  }
  .toggle {
    border: 0;
    background: transparent;
    color: var(--ink-3);
    font: inherit;
    cursor: pointer;
    padding: 0;
  }
  .toggle:hover { color: var(--ember-lit); }
  .toggle:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
</style>
</head>
<body data-density="comfortable" id="body">

<div class="register">

  <div class="group">
    <span class="label">Waiting on you</span>
    <span class="n">2</span>
    <span class="hair"></span>
  </div>

  <button class="row" data-state="waiting" data-unread="true">
    <span class="mark"></span>
    <span class="title">Migrate speech worklet off deprecated API</span>
    <span class="age">2h</span>
    <span class="under">
      <span class="repo">forgerie</span><span class="sep">/</span><span>fix/worklet</span>
      <span class="doing">Drop the old capture path, or keep both?</span>
    </span>
  </button>

  <button class="row" data-state="waiting" data-unread="true">
    <span class="mark"></span>
    <span class="title">Panel intent floor for tablet width</span>
    <span class="age">3h</span>
    <span class="under">
      <span class="repo">forgerie</span><span class="sep">/</span><span>feat/dock</span>
      <span class="doing">Tab Ultra 11 viewport is unmeasured</span>
    </span>
  </button>

  <div class="group">
    <span class="label">Running</span>
    <span class="n">3</span>
    <span class="hair"></span>
  </div>

  <button class="row" data-state="running" data-unread="true" aria-current="true">
    <span class="mark"></span>
    <span class="title">Linear-inspired design overhaul</span>
    <span class="age">1m</span>
    <span class="under">
      <span class="repo">forgerie</span><span class="sep">/</span><span>main</span>
      <span class="doing">write eslint-rules/no-raw-dimension.js</span>
      <span class="churn"><span class="add">+84</span> <span class="del">-0</span></span>
    </span>
  </button>

  <button class="row" data-state="running">
    <span class="mark"></span>
    <span class="title">Active reading techniques</span>
    <span class="age">37m</span>
    <span class="under">
      <span class="repo">comics</span><span class="sep">/</span><span>feat/reader</span>
      <span class="doing">test reader/annotations.spec.ts</span>
      <span class="churn"><span class="add">+412</span> <span class="del">-96</span></span>
    </span>
  </button>

  <button class="row fork" data-state="running">
    <span class="spine"></span>
    <span class="mark"></span>
    <span class="title">Annotation export, forked at message 214</span>
    <span class="age">12m</span>
    <span class="under">
      <span class="repo">comics</span><span class="sep">/</span><span>feat/reader-export</span>
      <span class="doing">read src/export/cbz.ts</span>
    </span>
  </button>

  <button class="row" data-state="running">
    <span class="mark"></span>
    <span class="title">Design styleguide contents</span>
    <span class="age">4m</span>
    <span class="under">
      <span class="repo">amaze-next</span><span class="sep">/</span><span>main</span>
      <span class="doing">read docs/brand/typography.md</span>
      <span class="churn"><span class="add">+18</span> <span class="del">-4</span></span>
    </span>
  </button>

  <div class="group">
    <span class="label">Blocked</span>
    <span class="n">1</span>
    <span class="hair"></span>
  </div>

  <button class="row" data-state="blocked">
    <span class="mark"></span>
    <span class="title">Upstream review for sessiond reconnect</span>
    <span class="age">1d</span>
    <span class="under">
      <span class="repo">forgerie</span><span class="sep">/</span><span>chore/upstream</span>
      <span class="doing">no upstream remote in this worktree</span>
    </span>
  </button>

  <div class="group">
    <span class="label">Idle</span>
    <span class="n">19</span>
    <span class="hair"></span>
  </div>

  <button class="row">
    <span class="mark"></span>
    <span class="title">Dictation lifecycle boundaries</span>
    <span class="age">2d</span>
    <span class="under"><span class="repo">forgerie</span><span class="sep">/</span><span>main</span></span>
  </button>
  <button class="row">
    <span class="mark"></span>
    <span class="title">Archive completed local plan</span>
    <span class="age">2d</span>
    <span class="under"><span class="repo">forgerie</span><span class="sep">/</span><span>main</span></span>
  </button>
  <button class="row">
    <span class="mark"></span>
    <span class="title">Colour ramp for print export</span>
    <span class="age">4d</span>
    <span class="under"><span class="repo">comics</span><span class="sep">/</span><span>main</span></span>
  </button>

  <button class="more">
    <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    16 more
  </button>

</div>

<div class="rail">
  <span><kbd>J</kbd> <kbd>K</kbd> move</span>
  <span><kbd>⏎</kbd> open</span>
  <span><kbd>E</kbd> archive</span>
  <span class="spacer"></span>
  <button class="toggle" id="toggle">comfortable</button>
</div>

<script>
  const body = document.getElementById("body");
  const toggle = document.getElementById("toggle");
  toggle.addEventListener("click", () => {
    const next = body.dataset.density === "compact" ? "comfortable" : "compact";
    body.dataset.density = next;
    toggle.textContent = next;
  });
  for (const row of document.querySelectorAll(".row")) {
    row.addEventListener("click", () => {
      for (const other of document.querySelectorAll(".row")) other.removeAttribute("aria-current");
      row.setAttribute("aria-current", "true");
      row.dataset.unread = "false";
    });
  }
</script>
</body>
</html>
