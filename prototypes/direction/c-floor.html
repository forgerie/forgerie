<!doctype html>
<html lang="en" data-direction="floor">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Direction C: Floor</title>
<style>
  /* ---------------------------------------------------------------
     DIRECTION C - FLOOR
     Thesis: Forgerie is a control room for many agents at once.
     You are not reading one conversation, you are supervising a floor.
     Lanes by what the work needs from you. Each tile shows live state.
     Opening one is a drill-down, not the default mode.
     --------------------------------------------------------------- */

  :root {
    color-scheme: dark;

    --canvas:       #0a0d0c;
    --surface:      #101413;
    --raised:       #161b1a;
    --line:         #1e2523;
    --line-soft:    #161b1a;

    --text:         #e4eae8;
    --text-muted:   #93a09c;
    --text-faint:   #5d6a66;

    --accent:       #2fd6a0;
    --accent-quiet: #2fd6a01a;

    --run:          #2fd6a0;
    --wait:         #e0b341;
    --block:        #e8695f;

    /* one radius system: soft, single step */
    --r:      10px;
    --r-pill: 999px;

    --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; min-width: 0; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--text);
    font: 400 14px/1.5 var(--ui);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.005em;
  }

  .floor {
    display: flex; flex-direction: column;
    height: 100dvh;
    container-type: inline-size;
  }

  /* ---- header: status of the whole floor, not of one session ---- */
  .head {
    display: flex; align-items: center; gap: clamp(10px, 2cqi, 20px);
    padding: clamp(12px, 2cqi, 18px) clamp(14px, 3cqi, 26px);
    border-bottom: 1px solid var(--line);
  }
  .head h1 {
    margin: 0; font-size: 15px; font-weight: 550; letter-spacing: -0.014em;
  }
  .vitals { display: flex; gap: clamp(10px, 2cqi, 18px); }
  .vital { display: flex; align-items: baseline; gap: 6px; }
  .vital .k {
    font: 500 20px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .vital .l {
    font: 400 11px/1 var(--ui);
    color: var(--text-faint);
  }
  .vital[data-kind="run"] .k { color: var(--run); }
  .vital[data-kind="wait"] .k { color: var(--wait); }
  .vital[data-kind="block"] .k { color: var(--block); }
  @container (max-width: 560px) { .head h1 { display: none; } }
  .head .spacer { flex: 1; }

  .new {
    display: inline-flex; align-items: center; gap: 7px;
    height: 32px; padding: 0 13px;
    border: 0; border-radius: var(--r-pill);
    background: var(--accent); color: #04140e;
    font: 500 13px/1 var(--ui);
    cursor: pointer;
  }
  .new:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .new svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
  @container (max-width: 420px) { .new .label { display: none; } .new { width: 32px; padding: 0; justify-content: center; } }

  /* ---- lanes: tracks appear as space allows, never a fixed count -- */
  .lanes {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
    align-content: start;
    gap: clamp(12px, 2cqi, 20px);
    padding: clamp(12px, 2cqi, 20px) clamp(14px, 3cqi, 26px) clamp(28px, 5cqi, 48px);
  }

  .lane { min-width: 0; }
  .lane-head {
    display: flex; align-items: center; gap: 8px;
    padding: 0 2px 10px;
  }
  .lane-head .swatch { width: 6px; height: 6px; border-radius: var(--r-pill); }
  .lane[data-lane="run"] .swatch { background: var(--run); }
  .lane[data-lane="wait"] .swatch { background: var(--wait); }
  .lane[data-lane="block"] .swatch { background: var(--block); }
  .lane[data-lane="idle"] .swatch { background: var(--text-faint); }
  .lane-head .name {
    font: 500 12px/1 var(--ui);
    letter-spacing: 0.01em;
    color: var(--text-muted);
  }
  .lane-head .n {
    margin-left: auto;
    font: 400 11px/1 var(--mono);
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }

  .stack { display: grid; gap: 8px; }

  /* ---- tile: the unit of supervision -------------------------- */
  .tile {
    display: grid;
    gap: 9px;
    width: 100%;
    padding: 12px 13px;
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--surface);
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    container-type: inline-size;
  }
  .tile:hover { background: var(--raised); border-color: color-mix(in oklab, var(--accent) 22%, var(--line)); }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tile:active { transform: translateY(1px); }

  .tile-top { display: flex; align-items: baseline; gap: 8px; }
  .tile .title {
    flex: 1;
    font-size: 13.5px; font-weight: 500; letter-spacing: -0.008em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tile .age {
    flex: none;
    font: 400 11px/1 var(--mono);
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }

  .tile .where {
    display: flex; gap: 7px;
    font: 400 11px/1 var(--mono);
    color: var(--text-faint);
  }
  .tile .where .repo { color: var(--text-muted); }

  /* live line: what the agent is doing right now, one line, truncated */
  .now {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 9px;
    border-radius: 7px;
    background: var(--canvas);
    font: 400 11.5px/1.4 var(--mono);
    color: var(--text-muted);
  }
  .now .a {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .beat {
    width: 5px; height: 5px; flex: none;
    border-radius: var(--r-pill);
    background: var(--run);
  }
  @media (prefers-reduced-motion: no-preference) {
    .beat { animation: beat 1.8s cubic-bezier(.2,0,0,1) infinite; }
  }
  @keyframes beat { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  /* the ask: the only thing that gets colour and a button */
  .ask {
    display: grid; gap: 8px;
    padding: 10px;
    border: 1px solid color-mix(in oklab, var(--wait) 35%, var(--line));
    border-radius: 7px;
    background: color-mix(in oklab, var(--wait) 9%, transparent);
  }
  .ask .q { font-size: 12.5px; line-height: 1.45; color: var(--text); }
  .ask .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt {
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    background: var(--surface);
    color: var(--text);
    font: 400 12px/1.3 var(--ui);
    cursor: pointer;
  }
  .opt:hover { border-color: var(--wait); }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* blocked reason reads as plain text, no alarm styling */
  .why {
    font-size: 12.5px; line-height: 1.45;
    color: var(--text-muted);
  }
  .why b { color: var(--text); font-weight: 550; }

  /* diff summary: numbers, not bars */
  .churn {
    display: flex; gap: 10px;
    font: 400 11px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--text-faint);
  }
  .churn .add { color: var(--run); }
  .churn .del { color: var(--block); }

  /* idle tiles are quieter: no live line, less padding */
  .lane[data-lane="idle"] .tile { padding: 10px 13px; background: transparent; }
  .lane[data-lane="idle"] .tile:hover { background: var(--surface); }
</style>
</head>
<body>

<div class="floor">

  <header class="head">
    <h1>Floor</h1>
    <div class="vitals">
      <div class="vital" data-kind="run"><span class="k">3</span><span class="l">running</span></div>
      <div class="vital" data-kind="wait"><span class="k">2</span><span class="l">waiting</span></div>
      <div class="vital" data-kind="block"><span class="k">1</span><span class="l">blocked</span></div>
    </div>
    <span class="spacer"></span>
    <button class="new">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span class="label">New</span>
    </button>
  </header>

  <div class="lanes">

    <!-- ---- WAITING first: it is what needs you ---- -->
    <section class="lane" data-lane="wait">
      <div class="lane-head">
        <span class="swatch"></span>
        <span class="name">Waiting on you</span>
        <span class="n">2</span>
      </div>
      <div class="stack">

        <button class="tile">
          <div class="tile-top">
            <span class="title">Migrate speech worklet off deprecated API</span>
            <span class="age">2h</span>
          </div>
          <div class="where"><span class="repo">forgerie</span><span>fix/worklet</span></div>
          <div class="ask">
            <div class="q">Drop support for the old capture path, or keep both behind a flag?</div>
            <div class="opts">
              <span class="opt">Drop it</span>
              <span class="opt">Keep both</span>
              <span class="opt">Explain the cost</span>
            </div>
          </div>
        </button>

        <button class="tile">
          <div class="tile-top">
            <span class="title">Panel intent floor for tablet width</span>
            <span class="age">3h</span>
          </div>
          <div class="where"><span class="repo">forgerie</span><span>feat/dock</span></div>
          <div class="ask">
            <div class="q">Tab Ultra 11 viewport is unmeasured. Guess it, or wait for the real device?</div>
            <div class="opts">
              <span class="opt">Wait for the device</span>
              <span class="opt">Use a placeholder</span>
            </div>
          </div>
        </button>

      </div>
    </section>

    <!-- ---- RUNNING ---- -->
    <section class="lane" data-lane="run">
      <div class="lane-head">
        <span class="swatch"></span>
        <span class="name">Running</span>
        <span class="n">3</span>
      </div>
      <div class="stack">

        <button class="tile">
          <div class="tile-top">
            <span class="title">Linear-inspired design overhaul</span>
            <span class="age">1m</span>
          </div>
          <div class="where"><span class="repo">forgerie</span><span>main</span></div>
          <div class="now"><span class="beat"></span><span class="a">write eslint-rules/no-raw-dimension.js</span></div>
          <div class="churn"><span class="add">+84</span><span class="del">-0</span><span>2 files</span></div>
        </button>

        <button class="tile">
          <div class="tile-top">
            <span class="title">Active reading techniques</span>
            <span class="age">37m</span>
          </div>
          <div class="where"><span class="repo">comics</span><span>feat/reader</span></div>
          <div class="now"><span class="beat"></span><span class="a">test reader/annotations.spec.ts</span></div>
          <div class="churn"><span class="add">+412</span><span class="del">-96</span><span>11 files</span></div>
        </button>

        <button class="tile">
          <div class="tile-top">
            <span class="title">Design styleguide contents</span>
            <span class="age">4m</span>
          </div>
          <div class="where"><span class="repo">amaze-next</span><span>main</span></div>
          <div class="now"><span class="beat"></span><span class="a">read docs/brand/typography.md</span></div>
          <div class="churn"><span class="add">+18</span><span class="del">-4</span><span>1 file</span></div>
        </button>

      </div>
    </section>

    <!-- ---- BLOCKED ---- -->
    <section class="lane" data-lane="block">
      <div class="lane-head">
        <span class="swatch"></span>
        <span class="name">Blocked</span>
        <span class="n">1</span>
      </div>
      <div class="stack">

        <button class="tile">
          <div class="tile-top">
            <span class="title">Upstream review for sessiond reconnect</span>
            <span class="age">1d</span>
          </div>
          <div class="where"><span class="repo">forgerie</span><span>chore/upstream</span></div>
          <div class="why">Stopped after three attempts. The remote <b>upstream</b> is
            not configured in this worktree, so the cursor range cannot be read.</div>
        </button>

      </div>
    </section>

    <!-- ---- IDLE ---- -->
    <section class="lane" data-lane="idle">
      <div class="lane-head">
        <span class="swatch"></span>
        <span class="name">Idle</span>
        <span class="n">19</span>
      </div>
      <div class="stack">
        <button class="tile">
          <div class="tile-top"><span class="title">Dictation lifecycle boundaries</span><span class="age">2d</span></div>
          <div class="where"><span class="repo">forgerie</span><span>main</span></div>
        </button>
        <button class="tile">
          <div class="tile-top"><span class="title">Archive completed local plan</span><span class="age">2d</span></div>
          <div class="where"><span class="repo">forgerie</span><span>main</span></div>
        </button>
        <button class="tile">
          <div class="tile-top"><span class="title">Colour ramp for print export</span><span class="age">4d</span></div>
          <div class="where"><span class="repo">comics</span><span>main</span></div>
        </button>
        <button class="tile">
          <div class="tile-top"><span class="title">Stored procedure handoff notes</span><span class="age">6d</span></div>
          <div class="where"><span class="repo">amaze-next</span><span>db/handoff</span></div>
        </button>
        <button class="tile">
          <div class="tile-top"><span class="title">Terminal soft keys preference</span><span class="age">8d</span></div>
          <div class="where"><span class="repo">forgerie</span><span>main</span></div>
        </button>
      </div>
    </section>

  </div>
</div>

</body>
</html>
