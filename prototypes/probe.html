<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>viewport probe</title>
  </head>
  <body>
    <!--
      Used by capture.sh to measure how much browser chrome chromium's
      --window-size includes, so posture screenshots get the CSS viewport
      they claim to.
    -->
    <p id="out">measuring…</p>
    <script>
      document.getElementById("out").textContent = `VIEWPORT ${window.innerWidth}x${window.innerHeight}`;
    </script>
  </body>
</html>
