<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Composer takeover</title>
<link rel="stylesheet" href="./sheet.css">
<style>
  /* Prototype-only controls. They float over the transcript instead of sitting
     in the flex flow, so they never steal height from the thing being judged. */
  .probe {
    position: fixed;
    top: 6px; right: 6px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    font-size: 11px;
    font-family: ui-monospace, Menlo, monospace;
  }
  .probe-row { display: flex; gap: 4px; }
  .probe button {
    min-height: 26px;
    padding: 0 8px;
    border: 1px solid var(--pi-border);
    border-radius: var(--pi-radius-control);
    background: #fffffff2;
    color: var(--pi-text-secondary);
    font: inherit;
    cursor: pointer;
  }
  .probe button[aria-pressed="true"] { border-color: var(--pi-accent); color: var(--pi-accent); }
  .probe-plan {
    padding: 3px 8px;
    border: 1px solid var(--pi-border-muted);
    border-radius: var(--pi-radius-control);
    background: #fffffff2;
    color: var(--pi-muted);
    text-align: right;
    max-width: 62vw;
  }
  /* The simulated keyboard exists so this is judgeable on a desktop. On the
     real phone the visual viewport does the same job for free. */
  .fake-key {
    flex: 0 0 auto;
    height: var(--fake-key, 0px);
    background: repeating-linear-gradient(45deg, #eceae5, #eceae5 8px, #e4e2dc 8px, #e4e2dc 16px);
    border-top: 1px solid var(--pi-border);
    transition: height var(--pi-motion-move) ease;
  }
  body[data-embed="1"] .probe { display: none; }
</style>
</head>
<body>
  <div class="frame">
    <div class="transcript" id="transcript">
      <div class="turn"><span class="who">agent</span>Reading the ask model in <code>src/shared/apiTypes.ts</code>: up to 20 questions, 12 options each, 4000 characters of free text per answer.</div>
      <div class="turn user"><span class="who">you</span>On the small screens I cannot tell where I am supposed to type.</div>
      <div class="turn"><span class="who">agent</span>Then the composer should become the question, rather than competing with it.</div>
    </div>

    <div class="composer-slot">
      <div class="column-probe" aria-hidden="true"></div>
      <composer-takeover id="composer"></composer-takeover>
    </div>
    <div class="fake-key" id="fakeKey"></div>
  </div>

  <div class="probe">
    <div class="probe-row">
      <button type="button" data-fixture="single">1q</button>
      <button type="button" data-fixture="few">3q</button>
      <button type="button" data-fixture="many">20q</button>
      <button type="button" id="closeAsk">close</button>
    </div>
    <div class="probe-row">
      <button type="button" id="keyToggle" aria-pressed="false">keyboard</button>
    </div>
    <div class="probe-plan" id="planOut">draft mode</div>
  </div>

<script type="module">
  import { FIXTURES } from "./takeover.mjs";

  const parameters = new URLSearchParams(location.search);
  document.body.dataset.embed = parameters.get("embed") ?? "0";

  const composer = document.getElementById("composer");
  const planOut = document.getElementById("planOut");
  const fakeKey = document.getElementById("fakeKey");
  const transcript = document.getElementById("transcript");

  /* Height is taken from the visual viewport, not from 100vh. An open keyboard
     shrinks the visual viewport; 100vh does not notice, which is exactly how a
     composer ends up under the keys and the page starts scrolling. */
  function syncFrameHeight() {
    const viewport = window.visualViewport;
    const height = viewport === undefined || viewport === null ? window.innerHeight : viewport.height;
    document.documentElement.style.setProperty("--app-h", `${String(Math.round(height))}px`);
  }
  syncFrameHeight();
  window.visualViewport?.addEventListener("resize", syncFrameHeight);
  window.visualViewport?.addEventListener("scroll", syncFrameHeight);
  window.addEventListener("resize", syncFrameHeight);

  composer.addEventListener("plan-changed", (event) => {
    const { plan, width, height } = event.detail;
    if (plan === undefined) {
      planOut.textContent = `draft · ${String(width)}x${String(height)}`;
      return;
    }
    planOut.textContent =
      `${String(width)}x${String(height)} · ${plan.structure} · ${plan.options}` +
      ` · budget ${String(plan.heightBudget)}px` +
      (plan.overflow.length === 0 ? " · all inline" : ` · overflow: ${plan.overflow.join(",")}`);
  });

  composer.addEventListener("ask-submitted", (event) => {
    const answered = event.detail.answers.filter((answer) => answer.values.length > 0 || answer.otherText !== undefined);
    const record = document.createElement("div");
    record.className = "ask-record";
    record.innerHTML = `<strong>Questions answered.</strong> ${String(answered.length)} of ${String(event.detail.answers.length)} carried a choice. This record has no inputs: the composer owned them.`;
    transcript.append(record);
    transcript.scrollTop = transcript.scrollHeight;
  });

  for (const button of document.querySelectorAll("[data-fixture]")) {
    button.addEventListener("click", () => {
      composer.open(FIXTURES[button.dataset.fixture]);
      const record = document.createElement("div");
      record.className = "ask-record";
      record.textContent = "The agent asked a question. The composer below is now the answer surface.";
      transcript.append(record);
      transcript.scrollTop = transcript.scrollHeight;
    });
  }
  document.getElementById("closeAsk").addEventListener("click", () => { composer.close(); });

  const keyToggle = document.getElementById("keyToggle");
  keyToggle.addEventListener("click", () => {
    const on = keyToggle.getAttribute("aria-pressed") === "true";
    keyToggle.setAttribute("aria-pressed", String(!on));
    /* Android's keyboard on this device takes roughly 45% of a portrait viewport
       and about half of a landscape one. Proportional is close enough to judge. */
    fakeKey.style.setProperty("--fake-key", on ? "0px" : `${String(Math.round(window.innerHeight * 0.45))}px`);
  });

  const fixture = parameters.get("fixture");
  if (fixture !== null && FIXTURES[fixture] !== undefined) composer.open(FIXTURES[fixture]);
  if (parameters.get("keyboard") === "1") keyToggle.click();
</script>
</body>
</html>
