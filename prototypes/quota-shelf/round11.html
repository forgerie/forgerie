<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Round 11 · pace with a sign — quota shelf</title>
<link rel="stylesheet" href="shelf.css">
<link rel="stylesheet" href="round2.css">
<link rel="stylesheet" href="round4.css">
<link rel="stylesheet" href="round11.css">
<style>
  .measure { font: 11px/1 var(--num); color: var(--dim); margin: 6px 0 0; }
  .measure b { font-weight: 500; }
  h2 { font-size: 13px; font-weight: 600; margin: 6px 0 8px; color: var(--muted); }
  .note { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
</style>
<h1>Round 11 · pace that says ahead or behind</h1>
<p class="note">One row holds both signs: 5h (steel) is far ahead of an even spend, Fable (violet) is far behind, week
(grey) is a little ahead.</p>
<h2>The Claude row at 2.6×</h2>
<div class="detail11" id="detail"></div>
<h2>Whole shelf, 360 px</h2>
<div class="ladder" id="ladder"></div>
<script src="data.js"></script>
<script src="plan.js"></script>
<script src="round4.js"></script>
<script src="round11.js"></script>
<script>
  const { NOW, ACCOUNTS } = window.QUOTA_FIXTURE;
  const plan = window.QUOTA_PLAN.plan(360, 620);
  const STYLES = [
    ["step", "step · tall before pace, thin after"],
    ["deficit", "deficit · notch, and hatching only when behind"],
    ["wedge", "wedge · under the lane, warm when behind"],
    ["square", "square · under the lane, warm when behind"],
  ];
  const CLAUDE = ACCOUNTS.filter((account) => account.provider === "Claude");

  const detail = document.getElementById("detail");
  for (const [style, title] of STYLES) {
    const col = document.createElement("div");
    const label = document.createElement("div");
    label.className = "detail-label";
    label.textContent = title;
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.append(window.QUOTA_ROUND11.shelf(CLAUDE, plan, NOW, { style }));
    col.append(label, frame);
    detail.append(col);
  }

  const ladder = document.getElementById("ladder");
  const measured = [];
  for (const [style] of STYLES) {
    const col = document.createElement("div");
    const label = document.createElement("div");
    label.className = "frame-label";
    label.innerHTML = `360 × auto <b>${style}</b>`;
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.style.width = "360px";
    frame.append(window.QUOTA_ROUND11.shelf(ACCOUNTS, plan, NOW, { style }));
    const measure = document.createElement("p");
    measure.className = "measure";
    col.append(label, frame, measure);
    ladder.append(col);
    measured.push({ frame, measure });
  }
  requestAnimationFrame(() => {
    for (const item of measured) {
      item.measure.innerHTML = `<b>${Math.round(item.frame.getBoundingClientRect().height)} px</b>`;
    }
  });
</script>
</html>
