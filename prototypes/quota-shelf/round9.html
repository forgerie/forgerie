<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Round 9 · telling the meters apart — quota shelf</title>
<link rel="stylesheet" href="shelf.css">
<link rel="stylesheet" href="round2.css">
<link rel="stylesheet" href="round4.css">
<link rel="stylesheet" href="round9.css">
<style>
  .measure { font: 11px/1 var(--num); color: var(--dim); margin: 6px 0 0; }
  .measure b { font-weight: 500; }
  h2 { font-size: 13px; font-weight: 600; margin: 6px 0 8px; color: var(--muted); }
  .note { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
</style>
<h1>Round 9 · which lane is which, without a word</h1>
<p class="note">No legend column. The Claude account holds 5h 85 %, week 96 %, Fable 38 %.</p>
<h2>The Claude row at 2×</h2>
<div class="detail9" id="detail"></div>
<h2>Whole shelf, 360 px</h2>
<div class="ladder" id="ladder"></div>
<script src="data.js"></script>
<script src="plan.js"></script>
<script src="round4.js"></script>
<script src="round9.js"></script>
<script>
  const { NOW, ACCOUNTS } = window.QUOTA_FIXTURE;
  const plan = window.QUOTA_PLAN.plan(360, 620);
  const TREATMENTS = [
    ["layers-span", "layers · short window, short track; Fable the thick lane"],
    ["layers-hue", "layers · one hue per meter"],
    ["ticks-shape", "ticks · dot, stem, square"],
    ["ticks-height", "ticks · short, medium, tall · pace below the rail"],
  ];
  const CLAUDE = ACCOUNTS.filter((account) => account.provider === "Claude");

  const detail = document.getElementById("detail");
  for (const [treatment, title] of TREATMENTS) {
    const col = document.createElement("div");
    const label = document.createElement("div");
    label.className = "detail-label";
    label.textContent = title;
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.append(window.QUOTA_ROUND9.shelf(CLAUDE, plan, NOW, { treatment }));
    col.append(label, frame);
    detail.append(col);
  }

  const ladder = document.getElementById("ladder");
  const measured = [];
  for (const [treatment, title] of TREATMENTS) {
    const col = document.createElement("div");
    const label = document.createElement("div");
    label.className = "frame-label";
    label.innerHTML = `360 × auto <b>${treatment}</b>`;
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.style.width = "360px";
    frame.append(window.QUOTA_ROUND9.shelf(ACCOUNTS, plan, NOW, { treatment }));
    const measure = document.createElement("p");
    measure.className = "measure";
    col.append(label, frame, measure);
    ladder.append(col);
    measured.push({ frame, measure });
  }
  requestAnimationFrame(() => {
    for (const item of measured) {
      item.measure.innerHTML = `<b>${Math.round(item.frame.getBoundingClientRect().height)} px</b>`;
    }
  });
</script>
</html>
