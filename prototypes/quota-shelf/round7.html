<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Round 7 · boolean and drained — quota shelf</title>
<link rel="stylesheet" href="shelf.css">
<link rel="stylesheet" href="round2.css">
<link rel="stylesheet" href="round4.css">
<link rel="stylesheet" href="round5.css">
<link rel="stylesheet" href="round6.css">
<link rel="stylesheet" href="round7.css">
<style>
  .measure { font: 11px/1 var(--num); color: var(--dim); margin: 6px 0 0; }
  .measure b { font-weight: 500; }
  h2 { font-size: 13px; font-weight: 600; margin: 4px 0 8px; color: var(--muted); }
</style>
<h1>Round 7 · the boolean, and the drained account</h1>
<h2>Gemini's cell, at 2×</h2>
<div class="detail" id="detail"></div>
<h2>Whole shelf, 360 px</h2>
<div class="ladder" id="ladder"></div>
<script src="data.js"></script>
<script src="plan.js"></script>
<script src="round4.js"></script>
<script src="round6.js"></script>
<script src="round7.js"></script>
<script>
  const { NOW, ACCOUNTS } = window.QUOTA_FIXTURE;
  const plan = window.QUOTA_PLAN.plan(360, 620);
  const STYLES = [
    ["dot", "dot · filled answers, hollow red refuses"],
    ["dash", "dash · a track with nothing in it"],
    ["hatch", "hatch · texture, never a fill"],
    ["exception", "exception · absent until it refuses"],
  ];

  // Two Antigravity accounts that both still have fuel: one whose Gemini
  // answers, one whose Gemini refuses. A drained account folds its lanes
  // away, which would hide the very state being judged.
  const refusing = structuredClone(ACCOUNTS[1]);
  refusing.state = "standby";
  delete refusing.coolingUntilMs;
  for (const lane of refusing.lanes) {
    if (lane.metered !== false) { lane.remainingPercent = 31; lane.resetsAtMs = NOW + 27 * 3600e3; }
  }
  const SAMPLE = [ACCOUNTS[0], refusing];

  const detail = document.getElementById("detail");
  for (const [style, title] of STYLES) {
    const col = document.createElement("div");
    const label = document.createElement("div");
    label.className = "detail-label";
    label.textContent = title;
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.append(window.QUOTA_ROUND7.shelf(SAMPLE, plan, NOW, { gemini: style, drained: "row" }));
    col.append(label, frame);
    detail.append(col);
  }

  const FRAMES = [
    { title: "dot · drained merged", options: { gemini: "dot", drained: "merged" } },
    { title: "hatch · drained merged", options: { gemini: "hatch", drained: "merged" } },
    { title: "dash · drained per account", options: { gemini: "dash", drained: "row" } },
    { title: "exception · drained merged", options: { gemini: "exception", drained: "merged" } },
  ];
  const ladder = document.getElementById("ladder");
  const measured = [];
  for (const spec of FRAMES) {
    const col = document.createElement("div");
    const label = document.createElement("div");
    label.className = "frame-label";
    label.innerHTML = `360 × auto <b>${spec.title}</b>`;
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.style.width = "360px";
    frame.append(window.QUOTA_ROUND7.shelf(ACCOUNTS, plan, NOW, spec.options));
    const measure = document.createElement("p");
    measure.className = "measure";
    col.append(label, frame, measure);
    ladder.append(col);
    measured.push({ frame, measure });
  }
  requestAnimationFrame(() => {
    for (const item of measured) {
      item.measure.innerHTML = `<b>${Math.round(item.frame.getBoundingClientRect().height)} px</b>`;
    }
  });
</script>
</html>
