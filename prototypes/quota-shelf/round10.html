<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Round 10 · pace on hued layers — quota shelf</title>
<link rel="stylesheet" href="shelf.css">
<link rel="stylesheet" href="round2.css">
<link rel="stylesheet" href="round4.css">
<link rel="stylesheet" href="round10.css">
<style>
  .measure { font: 11px/1 var(--num); color: var(--dim); margin: 6px 0 0; }
  .measure b { font-weight: 500; }
  h2 { font-size: 13px; font-weight: 600; margin: 6px 0 8px; color: var(--muted); }
  .note { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
</style>
<h1>Round 10 · four pace indicators on hued layers</h1>
<p class="note">Claude holds 5h 85 % (steel), week 96 % (grey), Fable 38 % (violet). Fable is burning far faster than
its week refills, so its pace gap is the wide one.</p>
<h2>The Claude row at 2.4×</h2>
<div class="detail10" id="detail"></div>
<h2>Whole shelf, 360 px</h2>
<div class="ladder" id="ladder"></div>
<script src="data.js"></script>
<script src="plan.js"></script>
<script src="round4.js"></script>
<script src="round10.js"></script>
<script>
  const { NOW, ACCOUNTS } = window.QUOTA_FIXTURE;
  const plan = window.QUOTA_PLAN.plan(360, 620);
  const PACES = [
    ["ghost", "ghost · the gap drawn as itself"],
    ["notch", "notch · a hairline cut out of the lane"],
    ["track", "track · darker ground past the pace point"],
    ["pip", "pip · a mark inside the lane"],
  ];
  const CLAUDE = ACCOUNTS.filter((account) => account.provider === "Claude");

  const detail = document.getElementById("detail");
  for (const [pace, title] of PACES) {
    const col = document.createElement("div");
    const label = document.createElement("div");
    label.className = "detail-label";
    label.textContent = title;
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.append(window.QUOTA_ROUND10.shelf(CLAUDE, plan, NOW, { pace }));
    col.append(label, frame);
    detail.append(col);
  }

  const ladder = document.getElementById("ladder");
  const measured = [];
  for (const [pace] of PACES) {
    const col = document.createElement("div");
    const label = document.createElement("div");
    label.className = "frame-label";
    label.innerHTML = `360 × auto <b>${pace}</b>`;
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.style.width = "360px";
    frame.append(window.QUOTA_ROUND10.shelf(ACCOUNTS, plan, NOW, { pace }));
    const measure = document.createElement("p");
    measure.className = "measure";
    col.append(label, frame, measure);
    ladder.append(col);
    measured.push({ frame, measure });
  }
  requestAnimationFrame(() => {
    for (const item of measured) {
      item.measure.innerHTML = `<b>${Math.round(item.frame.getBoundingClientRect().height)} px</b>`;
    }
  });
</script>
</html>
