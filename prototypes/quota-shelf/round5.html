<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Round 5 · fewer words — quota shelf</title>
<link rel="stylesheet" href="shelf.css">
<link rel="stylesheet" href="round2.css">
<link rel="stylesheet" href="round4.css">
<link rel="stylesheet" href="round5.css">
<style>
  .measure { font: 11px/1 var(--num); color: var(--dim); margin: 6px 0 0; }
  .measure b { font-weight: 500; }
  body { padding-bottom: 8px; }
</style>
<h1>Round 5 · fewer words</h1>
<div class="ladder" id="ladder"></div>
<script src="data.js"></script>
<script src="plan.js"></script>
<script src="round4.js"></script>
<script src="round5.js"></script>
<script>
  const FRAMES = [
    { round: 5, key: "collapsed", width: 360, title: "collapsed" },
    { round: 5, key: "expanded", width: 360, title: "expanded" },
    { round: 4, key: "collapsed", width: 360, title: "R4 collapsed (words)" },
    { round: 4, key: "expanded", width: 360, title: "R4 expanded (words)" },
    { round: 5, key: "collapsed", width: 236, title: "collapsed · 236" },
    { round: 5, key: "expanded", width: 236, title: "expanded · 236" },
  ];
  const { NOW, ACCOUNTS } = window.QUOTA_FIXTURE;
  const ladder = document.getElementById("ladder");
  const measured = [];
  for (const spec of FRAMES) {
    const col = document.createElement("div");
    const label = document.createElement("div");
    label.className = "frame-label";
    label.innerHTML = `${spec.width} × auto <b>${spec.title}</b>`;
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.style.width = `${spec.width}px`;
    const render = spec.round === 5 ? window.QUOTA_ROUND5[spec.key] : window.QUOTA_ROUND4[spec.key];
    frame.append(render(ACCOUNTS, window.QUOTA_PLAN.plan(spec.width, 620), NOW));
    const measure = document.createElement("p");
    measure.className = "measure";
    col.append(label, frame, measure);
    ladder.append(col);
    measured.push({ frame, measure });
  }
  requestAnimationFrame(() => {
    for (const item of measured) {
      const height = Math.round(item.frame.getBoundingClientRect().height);
      item.measure.innerHTML = `<b>${height} px</b>`;
    }
  });
</script>
</html>
