<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Round 22 · the live accounts, drawn exactly — quota shelf</title>
<link rel="stylesheet" href="shelf.css">
<link rel="stylesheet" href="round2.css">
<link rel="stylesheet" href="round4.css">
<link rel="stylesheet" href="round14.css">
<link rel="stylesheet" href="round15.css">
<link rel="stylesheet" href="round20.css">
<link rel="stylesheet" href="round21.css">
<link rel="stylesheet" href="round22.css">
<style>
  body { width: 912px; }
  h2 { font-size: 13px; font-weight: 600; margin: 30px 0 8px; color: var(--muted); }
  .note { color: var(--muted); font-size: 12px; margin: 0 0 16px; max-width: 82ch; }
  .note b { color: var(--ink); font-weight: 500; }
</style>
<h1>Round 22 · your three Codex accounts, exactly as they stand</h1>
<p class="stamp" id="stamp"></p>

<h2>The numbers the row is drawn from</h2>
<table class="facts" id="facts"></table>

<h2>The Codex row, six ways, at 2.4×</h2>
<div class="rows" id="rows"></div>

<h2>The whole shelf at 360 px</h2>
<div class="ladder" id="shelves"></div>

<script src="plan.js"></script>
<script src="round4.js"></script>
<script src="live.js"></script>
<script src="round22.js"></script>
<script>
  // round15/21 read the fixture's NOW at load; the live payload replaces it.
  window.QUOTA_FIXTURE = { NOW: Date.now(), MIN: 60000, HOUR: 3600000, DAY: 86400000, ACCOUNTS: [] };
</script>
<script src="round15.js"></script>
<script src="round21.js"></script>
<script>
  const { ACCOUNTS, groupOf, codexFacts, stamp, days, payload } = window.QUOTA_ROUND22;
  const NOW = Date.now();
  const facts = codexFacts(NOW);

  document.getElementById("stamp").innerHTML =
    `router said <b>${stamp(Date.parse(payload.updatedAt))}</b> · fetched <b>${stamp(window.QUOTA_LIVE_FETCHED_AT)}</b>`
    + ` · drawn <b>${stamp(NOW)}</b>`;

  const table = document.getElementById("facts");
  const pct = (value) => `${value.toFixed(1)} %`;
  table.innerHTML = `
    <thead><tr>
      <th>account</th><th>left</th><th>resets</th><th>in</th><th>window run</th><th>expiring</th>
    </tr></thead>
    <tbody>${facts.rows.map((r) => `
      <tr class="${r.routed ? "" : "spare"}">
        <td>${r.email}${r.routed ? " ·" : ""}</td>
        <td${r.fill <= 0 ? ' class="soft"' : ""}>${pct(r.fill)}</td>
        <td class="soft">${stamp(r.resetsAtMs)}</td>
        <td class="soft">${days(r.leftMs)}</td>
        <td class="soft">${pct(100 - r.pace)}</td>
        <td${r.surplus >= 0.5 ? ' class="warn"' : ' class="soft"'}>${pct(r.surplus)}</td>
      </tr>`).join("")}
    </tbody>
    <tfoot><tr>
      <td>pooled</td><td>${pct(facts.pooledFill)}</td><td></td>
      <td>${days(facts.soonest)}</td><td>${pct(100 - facts.pooledPace)}</td><td>${pct(facts.atRisk)}</td>
    </tr></tfoot>`;

  const codex = groupOf("codex");
  const LABELS = {
    today: "today · what the live shelf draws right now, one row per account",
    nest: "nest · every account keeps its own line",
    lead: "lead · the account in use, the bench as stubs",
    pool: "pool · round 15, the average that cancels",
    risk: "risk · round 20, the average plus what expires unspent",
    riser: "riser · round 21, the same bar told how many accounts it pools",
  };

  function pane(build, width, zoom) {
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.style.width = `${width}px`;
    if (zoom !== undefined) frame.style.zoom = zoom;
    frame.append(build());
    return frame;
  }

  function cell(container, caption, node, measured) {
    const box = document.createElement("div");
    const line = document.createElement("p");
    line.className = "cell-cap";
    line.innerHTML = caption;
    box.append(line, node);
    if (measured) {
      const measure = document.createElement("p");
      measure.className = "measure";
      box.append(measure);
      requestAnimationFrame(() => { measure.innerHTML = `<b>${measured().offsetHeight} px</b>`; });
    }
    container.append(box);
  }

  const rows = document.getElementById("rows");
  for (const [key, label] of Object.entries(LABELS)) {
    cell(rows, label, pane(() => {
      const root = document.createElement("div");
      root.className = "w r";
      // Spread first: appending a node removes it from the live collection,
      // and iterating that collection while it mutates skips every other row.
      if (key === "today") for (const row of [...window.QUOTA_ROUND15.shelf(codex.accounts, NOW, "today").children]) root.append(row);
      else if (key === "risk") root.append(window.QUOTA_ROUND21.groupRow(codex, NOW, { seam: "none" }));
      else if (key === "riser") root.append(window.QUOTA_ROUND21.groupRow(codex, NOW, { seam: "riser" }));
      else root.append(window.QUOTA_ROUND15.groupRow(codex, NOW, key));
      return root;
    }, 360, 2.4));
  }

  const shelves = document.getElementById("shelves");
  let shipped;
  cell(shelves, "<b>today</b> · what is running on the live shelf",
    pane(() => (shipped = window.QUOTA_ROUND15.shelf(ACCOUNTS, NOW, "today")), 360), () => shipped);
  let proposed;
  cell(shelves, "<b>riser</b> · round 21",
    pane(() => (proposed = window.QUOTA_ROUND21.shelf(ACCOUNTS, NOW, { seam: "riser" })), 360), () => proposed);
</script>
</html>
