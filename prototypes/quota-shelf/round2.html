<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Round 2 · density — quota shelf</title>
<link rel="stylesheet" href="shelf.css">
<link rel="stylesheet" href="round2.css">
<style>
  .col { min-width: 0; }
  .measure { font: 11px/1 var(--num); color: var(--dim); margin: 6px 0 0; }
  .measure b { font-weight: 500; }
  .win { color: var(--ok); }
  .lose { color: var(--danger); }
</style>
<h1>Round 2 · same fixes, less height</h1>
<p>Every column renders the same seven accounts at 360&nbsp;px, the width of the real panel. The first column replicates
the shipped shelf using its own paddings, so the measured heights below are a ruler and not an impression.</p>
<div class="ladder" id="ladder"></div>
<script src="data.js"></script>
<script src="plan.js"></script>
<script src="round2.js"></script>
<script>
  const WIDTH = 360;
  const VARIANTS = [
    ["today", "0 · today (shipped)"],
    ["e", "E · trimmed"],
    ["f", "F · one line per account"],
    ["g", "G · routed only"],
  ];
  const { NOW, ACCOUNTS } = window.QUOTA_FIXTURE;
  const ladder = document.getElementById("ladder");
  const heights = [];
  for (const [key, title] of VARIANTS) {
    const col = document.createElement("div");
    col.className = "col";
    const label = document.createElement("div");
    label.className = "frame-label";
    label.innerHTML = `${WIDTH} × auto <b>${title}</b>`;
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.style.width = `${WIDTH}px`;
    const shelf = window.QUOTA_ROUND2[key](ACCOUNTS, window.QUOTA_PLAN.plan(WIDTH, 620), NOW);
    frame.append(shelf);
    const measure = document.createElement("p");
    measure.className = "measure";
    col.append(label, frame, measure);
    ladder.append(col);
    heights.push({ key, frame, measure });
  }
  requestAnimationFrame(() => {
    const base = heights[0].frame.getBoundingClientRect().height;
    for (const item of heights) {
      const height = Math.round(item.frame.getBoundingClientRect().height);
      const delta = Math.round(height - base);
      const cls = delta > 0 ? "lose" : delta < 0 ? "win" : "";
      item.measure.innerHTML = item.key === "today"
        ? `<b>${height} px</b> · baseline`
        : `<b>${height} px</b> · <span class="${cls}">${delta > 0 ? "+" : ""}${delta} px</span>`;
    }
  });
</script>
</html>
