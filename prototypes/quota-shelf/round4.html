<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Round 4 · quiet — quota shelf</title>
<link rel="stylesheet" href="shelf.css">
<link rel="stylesheet" href="round2.css">
<link rel="stylesheet" href="round3.css">
<link rel="stylesheet" href="round4.css">
<style>
  .measure { font: 11px/1 var(--num); color: var(--dim); margin: 6px 0 0; }
  .measure b { font-weight: 500; }
  .win { color: var(--ok); }
</style>
<h1>Round 4 · quiet</h1>
<p>Round 3 beside round 4 at the same width. Health carries no colour, the provider is a two-letter tag, the routed
account is a dot rather than a word, and every countdown states one unit: <code>38h</code>, not <code>1d 14h</code>.
Amber and red are then the only saturated marks in the panel.</p>
<div class="ladder" id="ladder"></div>
<script src="data.js"></script>
<script src="plan.js"></script>
<script src="round2.js"></script>
<script src="round3.js"></script>
<script src="round4.js"></script>
<script>
  const FRAMES = [
    { round: 4, key: "collapsed", width: 360, title: "R4 collapsed" },
    { round: 4, key: "expanded", width: 360, title: "R4 expanded" },
    { round: 3, key: "collapsed", width: 360, title: "R3 collapsed (noisy)" },
    { round: 3, key: "expanded", width: 360, title: "R3 expanded (noisy)" },
    { round: 4, key: "collapsed", width: 236, title: "R4 collapsed · 236" },
    { round: 4, key: "expanded", width: 236, title: "R4 expanded · 236" },
  ];
  const { NOW, ACCOUNTS } = window.QUOTA_FIXTURE;
  const ladder = document.getElementById("ladder");
  const measured = [];
  for (const spec of FRAMES) {
    const col = document.createElement("div");
    const label = document.createElement("div");
    label.className = "frame-label";
    label.innerHTML = `${spec.width} × auto <b>${spec.title}</b>`;
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.style.width = `${spec.width}px`;
    const render = spec.round === 4 ? window.QUOTA_ROUND4[spec.key] : window.QUOTA_ROUND3[spec.key];
    frame.append(render(ACCOUNTS, window.QUOTA_PLAN.plan(spec.width, 620), NOW));
    const measure = document.createElement("p");
    measure.className = "measure";
    col.append(label, frame, measure);
    ladder.append(col);
    measured.push({ frame, measure });
  }
  requestAnimationFrame(() => {
    for (const item of measured) {
      const height = Math.round(item.frame.getBoundingClientRect().height);
      item.measure.innerHTML = `<b>${height} px</b> · <span class="win">${height - 560} px</span> vs shipped`;
    }
  });
</script>
</html>
