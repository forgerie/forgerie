<svg xmlns="http://www.w3.org/2000/svg" width="739" height="586" viewBox="0 0 739 586">
<title>G3 — right-aligned question</title>
<rect width="739" height="586" fill="#070912"/>
<text x="626" y="55" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">Pool all activity in a turn, keeping it adjacent to the</text>
<text x="626" y="79" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">seconds line at the bottom</text>
<text x="114" y="119" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">Three separate causes, and only one of them is spacing.</text>
<text x="114" y="159" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">The label is the loudest thing in the transcript. Body prose is</text>
<text x="114" y="183" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">regular weight; the marker is bold, uppercase and tracked out.</text>
<text x="114" y="223" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">Pooling gives up strict chronology inside a turn. Order still</text>
<text x="114" y="247" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">survives inside the fold.</text>
<text x="114" y="287" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" fill="#817a99">▸  27 steps</text>
<text x="626" y="343" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">The agent text is what I want to read deeply, and it is the</text>
<text x="626" y="367" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">part that looks greyed out.</text>
<text x="114" y="407" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">Contrast was doing identity work. Freed from that, it can mark</text>
<text x="114" y="431" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">what is worth reading instead.</text>
<text x="114" y="471" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">Here is the same conversation with the hierarchy the right way up.</text>
<text x="114" y="511" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" fill="#817a99">▸  7 steps</text>
<circle cx="118" cy="534" r="3.5" fill="#7c3cff"/>
<text x="130" y="539" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" fill="#817a99">11s · read chatGroups.ts</text>
</svg>