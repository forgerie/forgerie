<svg xmlns="http://www.w3.org/2000/svg" width="739" height="658" viewBox="0 0 739 658">
<title>G1 — banded question</title>
<rect width="739" height="658" fill="#070912"/>
<rect x="0" y="40" width="739" height="84" fill="#101527"/>
<text x="114" y="73" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">Pool all activity in a turn, keeping it adjacent to the</text>
<text x="114" y="97" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">seconds line at the bottom</text>
<text x="114" y="155" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">Three separate causes, and only one of them is spacing.</text>
<text x="114" y="195" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">The label is the loudest thing in the transcript. Body prose is</text>
<text x="114" y="219" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">regular weight; the marker is bold, uppercase and tracked out.</text>
<text x="114" y="259" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">Pooling gives up strict chronology inside a turn. Order still</text>
<text x="114" y="283" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">survives inside the fold.</text>
<text x="114" y="323" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" fill="#817a99">▸  27 steps</text>
<rect x="0" y="364" width="739" height="84" fill="#101527"/>
<text x="114" y="397" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">The agent text is what I want to read deeply, and it is the</text>
<text x="114" y="421" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">part that looks greyed out.</text>
<text x="114" y="479" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">Contrast was doing identity work. Freed from that, it can mark</text>
<text x="114" y="503" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">what is worth reading instead.</text>
<text x="114" y="543" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" fill="#f7f4ff">Here is the same conversation with the hierarchy the right way up.</text>
<text x="114" y="583" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" fill="#817a99">▸  7 steps</text>
<circle cx="118" cy="606" r="3.5" fill="#7c3cff"/>
<text x="130" y="611" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" fill="#817a99">11s · read chatGroups.ts</text>
</svg>