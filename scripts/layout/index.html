<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Without this the postures do not reach the fixture: mobile emulation
         with no viewport tag lays every posture out at Chromium's default
         980px layout viewport, so a folded pane was measured at the width of a
         tablet. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgerie layout fixtures</title>
    <!-- The design tokens are injected from the app's own index.html at build
         time. Restating them here would let the harness drift into measuring a
         layout the app does not have. -->
    <style>
      /* The app frame sizes the transcript; here the viewport stands in for it,
         because the measurements are about the transcript's own boxes. */
      html, body { margin: 0; height: 100%; }
      body { display: flex; }
      chat-view, session-inbox-panel { flex: 1 1 auto; min-height: 0; }
    </style>
  </head>
  <body>
    <script type="module" src="./transcript-fixture.ts"></script>
    <script type="module" src="./inbox-fixture.ts"></script>
  </body>
</html>
